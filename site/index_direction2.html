N.3.2.6\">EN.3.2.6<\/span>).<\/p>", "<p>In contrast, water intake by food and beverage manufacturers declined by 19.4%, from 406.1 million m³ in 2013 to 327.1 million m³ in 2021 (<span class=\"ref\" title=\"Dashboard metric EN.3.2.3\">EN.3.2.3<\/span>). The entire decline occurred in food manufacturing, where intake fell by 22.8% (from 367.0 to 283.4 million m³), while beverage and tobacco intake rose from 39.1 to 43.7 million m³. Without corresponding production data, it is not possible to determine whether this reflects improved efficiency or lower output.<\/p>"], "limitations": ["<p>Water stress, defined as water withdrawals relative to natural replenishment, is not measured at the national scale. Environment and Climate Change Canada discontinued this metric about 10 years ago. Without it, the indicator cannot show pressure on water supply or differences between regions.<\/p>", "<p>Most metrics report total water use without linking it to production. As a result, changes in water use cannot be clearly attributed to efficiency gains, output changes or weather. For example, the decline in water intake by food manufacturers may reflect improved efficiency or lower output. Water use per unit of product is available only for beef (<span class=\"ref\" title=\"Dashboard metric EN.3.2.6\">EN.3.2.6<\/span>), and greenhouse water use is not tracked.<\/p>", "<p>Water use is strongly influenced by weather, which makes underlying trends difficult to identify. Because irrigation is concentrated in southern Alberta, national irrigation totals largely reflect Prairie growing conditions. Combined with short series that are reported only every second year, this makes it difficult to separate the effects of weather from changes in irrigated area, crop mix or practices.<\/p>", "<p>Several series have ended or have gaps. Statistics Canada has indicated that 2024 was the final release of the Agricultural Water Survey, as a result of their Budget 2025 spending reductions, so the irrigation series (<span class=\"ref\" title=\"Dashboard metric EN.3.2.1\">EN.3.2.1<\/span>, <span class=\"ref\" title=\"Dashboard metric EN.3.2.4\">EN.3.2.4<\/span>, <span class=\"ref\" title=\"Dashboard metric EN.3.2.5\">EN.3.2.5<\/span>) will not be updated. Water use in crop and animal production ends in 2021 and is reported every second year, and processing water use also ends in 2021, with irregular reporting years.<\/p>", "<p>Water efficiency and water management practices, such as the type of irrigation system used, are not yet measured, even though the indicator is intended to show how efficiently water is used. The water quality series are also short: the river water quality data and the Canadian Water Monitoring Program for Pesticides data currently available both cover only 2022 to 2024.<\/p>", "<p>Water stress, defined as water withdrawals relative to natural replenishment, is not measured at the national scale. Environment and Climate Change Canada discontinued this metric about 10 years ago. Without it, the indicator cannot show pressure on water supply or differences between regions.<\/p>", "<p>Greenhouse water use is not tracked, and product-level water intensity is available only for beef (<span class=\"ref\" title=\"Dashboard metric EN.3.2.6\">EN.3.2.6<\/span>).<\/p>", "<p>Water efficiency and water management practices are not yet measured, even though the indicator is intended to show how efficiently water is used. The water quality series are also short: the river water quality data and the Canadian Water Monitoring Program for Pesticides data currently available both cover only 2022 to 2024.<\/p>", "<p>Several series end early or have gaps. Water use in crop and animal production ends in 2021 and is reported only every second year, and processing water use also ends in 2021, with irregular reporting years. Statistics Canada has indicated that 2024 was the final release of the Agricultural Water Survey, so the irrigation series (<span class=\"ref\" title=\"Dashboard metric EN.3.2.1\">EN.3.2.1<\/span>, <span class=\"ref\" title=\"Dashboard metric EN.3.2.4\">EN.3.2.4<\/span>, <span class=\"ref\" title=\"Dashboard metric EN.3.2.5\">EN.3.2.5<\/span>) will not be updated. In addition, because irrigation is concentrated in Alberta, national irrigation totals largely reflect Prairie weather conditions.<\/p>"], "opportunities": ["<p>Pairing water use with sector GDP or farm cash receipts would show water productivity, measured as dollars of output per cubic metre of water.<\/p>", "<p>Product-level water intensity could be expanded beyond beef. Life cycle assessments for chicken and milk already report water use per kilogram of product and could be added. Greenhouse water use, which is not currently tracked, would also fill a gap.<\/p>", "<p>With the discontinuation of Statistics Canada’s agricultural and industrial water surveys, a priority will be identifying alternative sources for agricultural and processing water use. These could include provincial irrigation and water licensing data, such as Alberta’s annual irrigation district reports, and work with Statistics Canada on how water use could be estimated through administrative data or modelling. Continued monitoring through the Canadian Water Monitoring Program for Pesticides will also be important for building useful trend data.<\/p>", "<p>The largest gap, however, is the lack of a national water stress measure, and restoring one would add the most value to this indicator.<\/p>"], "notes": ["<a href=\"https://www150.statcan.gc.ca/n1/daily-quotidien/211213/dq211213d-eng.htm\" rel=\"noopener\" target=\"_blank\">Statistics Canada, Agricultural Water Survey, 2020, The Daily (December 13, 2021)<\/a>", "Statistics Canada, <a href=\"https://www150.statcan.gc.ca/n1/daily-quotidien/231017/dq231017c-eng.htm\" rel=\"noopener\" target=\"_blank\">Agricultural Water Survey, 2022, The Daily (October 17, 2023)<\/a>", "Agricultural Moisture Situation Update (July 18, 2024)"]}, "EN.4": {"code": "EN.4", "dash": "4", "title": "Biodiversity & Agrobiodiversity", "block": "env", "page": "ind_4", "metrics": 7, "groups": [{"code": "En4.1", "name": "State of Biodiversity & Habitat Change", "planned": false, "metrics": [{"page": "ind_4", "code": "EN.4.1.1", "name": "Wildlife Habitat Capacity on Farms (reproduction)", "src": [["Agri-Environmental Indicator - Wildlife Habitat Capacity", "Agriculture and Agri-Food Canada", "https://open.canada.ca/data/en/dataset/0ff616fd-417d-4fe3-a574-d554b4492ba7", "https://agriculture.canada.ca/en/environment/resource-management/indicators", "Wildlife habitat capacity polygon file (WHC_R)", "2000–2020 (5 years)", ""]], "smooth": true, "about": {"unit": "", "unit_short": "", "calc": "Plain (unweighted) mean of WHC_R_VAL across all reporting SLC polygons for that year", "naics": ""}}, {"page": "m_4_1_2", "code": "EN.4.1.2", "name": "Harvest Level of Key Fish Stock", "src": [["Sustainability Survey for Fisheries: harvest of key stocks relative to approved levels, Canada, 2011 to 2024", "Fisheries and Oceans Canada", "https://www.dfo-mpo.gc.ca/reports-rapports/regs/sff-cpd/survey-sondage/index-en.html", "https://www.canada.ca/en/environment-climate-change/services/environmental-indicators/harvest-levels-key-fish-stocks.html", "Table: harvest of key stocks relative to approved levels", "2011–2024", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "(At or below removal reference + At or below other approved levels) / Total, converted to a percentage", "naics": ""}}, {"page": "m_4_1_3", "code": "EN.4.1.3", "name": "Wildlife Habitat Capacity on Farms (reproduction) - Rate of Change", "src": [["Agri-Environmental Indicator - Wildlife Habitat Capacity", "Agriculture and Agri-Food Canada", "https://open.canada.ca/data/en/dataset/0ff616fd-417d-4fe3-a574-d554b4492ba7", "https://agriculture.canada.ca/en/environment/resource-management/indicators", "Wildlife habitat capacity change file (WHC_R_00_20_CHG_VAL, per-year blocks)", "2000-2005, 2005-2010, 2010-2015, 2015-2020", ""]], "smooth": true, "about": {"unit": "Per cent change per year (an annual rate of change).", "unit_short": "Per cent change per year (an annual rate of change).", "calc": "(National plain-mean WHC_R_VAL at end of interval - at start) / years in interval, where each endpoint's national value is the unweighted mean of WHC_R_VAL across all reporting SLC polygons for that census year", "naics": ""}}]}, {"code": "En4.2", "name": "Conversion of farmland to urbanization", "planned": false, "metrics": [{"page": "m_4_2_1", "code": "EN.4.2.1", "name": "Conversion of farmland to urbanization", "src": [], "smooth": false, "about": {"unit": "", "unit_short": "", "calc": "", "naics": "", "note": "No data yet. This sub-indicator is planned for the Index; no metric is available to report so far."}}]}, {"code": "En4.3", "name": "Composite view: state of biodiversity & habitat change", "planned": false, "metrics": [{"page": "m_4_3_1", "code": "EN.4.3.1", "name": "Changes in Landscapes within Agricultural Land", "src": [["Wildlife Habitat Capacity on Farmland Indicator (Agri-Environmental Indicators Report, Census Year 2021)", "Agriculture and Agri-Food Canada", "https://open.canada.ca/data/en/dataset/0ff616fd-417d-4fe3-a574-d554b4492ba7", "https://agriculture.canada.ca/en/environment/resource-management/indicators", "Table 1, Canada row (State 2020 and change 2000-2020)", "2000-2020", ""]], "smooth": false, "about": {"unit": "Difference between two percentages (for example 12% to 15% is 3 percentage points).", "unit_short": "Difference between two percentages (for example 12% to 15% is 3 percentage points).", "calc": "Value taken directly from the cited report's Table 1, Canada row", "naics": ""}}]}, {"code": "En4.4", "name": "Disaggregated views: state of biodiversity & habitat change", "planned": true, "metrics": [{"page": "m_4_4_1", "code": "EN.4.4.1", "name": "Disaggregated views: state of biodiversity & habitat change", "src": [], "smooth": false, "about": {"unit": "", "unit_short": "", "calc": "", "naics": "", "note": "No data yet. This sub-indicator is planned for the Index; no metric is available to report so far."}}]}, {"code": "En4.5", "name": "Agrobiodiversity", "planned": true, "metrics": [{"page": "m_4_5_1", "code": "EN.4.5.1", "name": "Agrobiodiversity", "src": [], "smooth": false, "about": {"unit": "", "unit_short": "", "calc": "", "naics": "", "note": "No data yet. This sub-indicator is planned for the Index; no metric is available to report so far."}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#6E8F57\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"20\" r=\"8.5\"/><path d=\"M24 28.5 V38 M24 33 L28 29.5 M17 38 H31\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#6E8F57\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"20\" r=\"8.5\"/><path d=\"M24 28.5 V38 M24 33 L28 29.5 M17 38 H31\"/><\/g><\/svg>", "teaser": "Biodiversity is difficult to measure directly, so this indicator uses measures such as wildlife habitat capacity on farmland, land-cover change and fish stock harvest levels as proxies to…", "about": ["<p>Biodiversity is difficult to measure directly, so this indicator uses measures such as wildlife habitat capacity on farmland, land-cover change and fish stock harvest levels as proxies to assess trends in condition of, and changes to habitats in agricultural and marine landscapes In the context of terrestrial agrobiodiversity, these measures provide insight into how well working farmland supports wildlife, ecosystem functions, and resilient food production. The aim is to better understand changes in the distribution of different land use types across our agricultural landscapes, and how those landscapes can support certain components of biodiversity, such as wildlife.<\/p>"], "observations": ["<p>Wildlife habitat capacity on agricultural land declined by 3.1% between 2000 and 2020, from 30.75 to 29.81 (<span class=\"ref\" title=\"Dashboard metric EN.4.1.1\">EN.4.1.1<\/span>). The index estimates how well agricultural land can support wildlife, based on the types of land cover present and their value as habitat for breeding and feeding. Most of the decline occurred between 2005 and 2015, when the index fell by about 0.07 to 0.08 points per year. Between 2015 and 2020, the rate of decline slowed to less than 0.01 points per year (<span class=\"ref\" title=\"Dashboard metric EN.4.1.3\">EN.4.1.3<\/span>). This may indicate that the decline is levelling off, although it reflects only one five-year period.<\/p>", "<p>Changes in land cover help explain the decline. Between 2000 and 2020, native grassland and unimproved pasture, which provide the most valuable habitat, declined by 0.42 and 0.20 percentage points of agricultural land area, respectively. Coniferous and deciduous woodland declined by 1.75 and 1.25 points, and perennial cropland by 0.92 points. The largest gains were in regenerating woodland after harvest (+2.22) and annual cropland (+1.29), while built-up land, including settlements and roads, increased by 0.72 points (<span class=\"ref\" title=\"Dashboard metric EN.4.3.1\">EN.4.3.1<\/span>). Overall, these changes reflect a shift from natural and perennial cover toward annual crops and developed land.<\/p>", "<p>Because native grassland and pasture are used largely for beef production, land associated with the beef industry accounts for most of the wildlife habitat capacity on Canada’s cropland and pastureland<sup>1<\/sup>. According to the National Beef Sustainability Assessment, reproductive habitat capacity on cropland and pastureland was 7.74 points in 2016, of which land associated with the beef cattle industry contributed 5.48 points (71%). By 2021, overall reproductive habitat capacity had decreased to 7.61 points because of land conversion, while the beef industry’s contribution increased to 5.63 points (74%). These results suggest that reproductive habitat on land used for beef production increased even as overall wildlife habitat declined. Note that these figures use different years and methods from the AAFC series above.<\/p>", "<p>Fisheries, also part of the agri-food sector, show improvement over the past decade. In 2024, 96.5% of key fish stocks (191 of 198) were harvested at or below their removal references or other approved levels, up from 89.7% in 2011 (<span class=\"ref\" title=\"Dashboard metric EN.4.1.2\">EN.4.1.2<\/span>). Most of this gain occurred by 2013, and the share has remained between 94% and 99% each year since 2012. Because the list of key stocks has changed over time, comparisons between years should be made with caution<\/p>"], "limitations": ["<p>Habitat is a proxy for biodiversity, and the data do not reflect species-level trends, genetic diversity or long-term biodiversity tracking. The wildlife habitat capacity index focuses mainly on vertebrates and does not include pollinators or other invertebrates.<\/p>", "<p>There is no measure of crop diversity or landscape heterogeneity, such as field size, buffers and other habitat features, and no composite or disaggregated view of biodiversity.<\/p>", "<p>The available data are also dated and coarse. Habitat capacity is reported in five-year intervals up to 2020, land cover change covers 2000 to 2020, and the fish stock measure describes fisheries rather than farmland.<\/p>", "<p>Farmland bird data from Birds Canada were assessed during the metrics review (January to June 2026).<sup>2<\/sup> Although the data for the Prairies are detailed and cover a long period, they were considered too limited for this indicator because they do not cover other regions.<\/p>", "<p>No metrics have yet been identified for agrobiodiversity, the diversity of crops, livestock and other organisms that support food production. The indicator therefore cannot show the diversity of crop varieties and livestock breeds in use, the conservation of genetic resources, or how well farmland supports services such as pollination and natural pest control.<\/p>"], "opportunities": ["<p>Biodiversity is difficult to measure, and data are the main challenge. Few datasets are collected at a national scale, repeated regularly and updated often enough to show change over time. Crop diversity, landscape heterogeneity, and pollinators and other invertebrates all shape the health of farmed landscapes, but the indicator does not yet reflect them. Datasets and metrics for these areas were explored during the review, and more work is needed to identify appropriate metrics and data before these measures, or a composite view of biodiversity, can be added.<\/p>", "<p>While national data remain a challenge, provincial programs offer useful models. The Alberta Biodiversity Monitoring Institute (ABMI) monitors wildlife, habitat and human footprint across Alberta, and its approach could be considered by other provinces.⁵<sup>3<\/sup><\/p>", "<p>Agrobiodiversity is a priority gap, as no metrics have yet been identified. Potential starting points include crop diversity derived from Census of Agriculture land use data, national genetic resource collections for crops and livestock (such as those held by Agriculture and Agri-Food Canada), and the conservation status of livestock breeds reported to the FAO’s Domestic Animal Diversity Information System (DAD-IS). Further work would be needed to assess whether these sources are suitable for regular reporting.<\/p>"], "notes": ["<a href=\"https://crsb.ca/wp-content/uploads/2025/06/1.-SUMMARY-REPORT_CRSB-National-Beef-Sustainability-Assessment-Strategy_EN.pdf\" rel=\"noopener\" target=\"_blank\">Canadian Roundtable for Sustainable Beef (2024). National Beef Sustainability Assessment &amp; Strategy: Summary Report, 2014–2021<\/a>", "<a href=\"https://www.stateofcanadasbirds.org/\" rel=\"noopener\" target=\"_blank\">Birds Canada, State of Canada’s Birds<\/a>", "<a href=\"https://abmi.ca/\" rel=\"noopener\" target=\"_blank\">Alberta Biodiversity Monitoring Institute<\/a>"]}, "EN.5": {"code": "EN.5", "dash": "5", "title": "Crop Input Use & Management", "block": "env", "page": "ind_5", "metrics": 7, "groups": [{"code": "En5.1", "name": "Responsible pest control product use", "planned": false, "metrics": [{"page": "ind_5", "code": "EN.5.1.1", "name": "Chemical Residues in Domestic Fresh Fruits and Vegetables", "src": [["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/food-safety-testing-reports-and-journal-articles/national-chemical-residue-monitoring-program-and-c-2", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2016-2017", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/food-safety-testing-reports-and-journal-articles/national-chemical-residue-monitoring-program-and-c-1", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2017-2018", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/food-safety-testing-reports-and-journal-articles/national-chemical-residue-monitoring-program-and-c", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2018-2019", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/food-safety-testing-reports-and-journal-articles/national-chemical-residue-monitoring-program-and-c-0", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2019-2020", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/testing-reports-and-journal-articles/annual-report-2020-2021", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2020-2021", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/food-chemistry-and-microbiology/testing-reports-and-journal-articles/2021-2022-ncrmp-report", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2021-2022", ""], ["CFIA National Chemical Residue Monitoring Program (NCMP)", "Canadian Food Inspection Agency", "https://open-science.canada.ca/items/f87b0dc3-95fc-4877-a8c8-c3810884d7ff", "", "Annex B: Table B-1 Results Summary for Canadian Food Products", "2022-2023", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "(Total Samples - Total Violations) / Total Samples, as a percentage", "naics": ""}}]}, {"code": "En5.2", "name": "Responsible nutrient use", "planned": false, "metrics": [{"page": "m_5_2_1", "code": "EN.5.2.1", "name": "Adoption of 4R Nutrient Stewardship practices", "src": [["Fertilizer Canada / Stratus Ag Research", "Fertilizer Canada / Stratus Ag Research", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "'4R Performance Levels - Nitrogen and Phosphorus' slide of each crop", "2024, 2025", ""]], "smooth": false, "about": {"unit": "Percentage of sampled farmland (hectares) or growers adopting the practice: all Basic 4R criteria for nitrogen and phosphorus (5.2.1), or variable rate technology on some or all fields (5.2.2).", "unit_short": "Percentage of sampled farmland (hectares) or growers adopting the practice: all Basic 4R criteria for nitrogen and phosphorus (5.2.1), or variable rate technology on some or all fields (5.2.2).", "calc": "% of Sampled Hectares = % of acres meeting all Basic 4R criteria for both Nitrogen and Phosphorus, taken directly from Fertilizer Canada's 4R Performance Levels analysis for that year", "naics": ""}}, {"page": "m_5_2_2", "code": "EN.5.2.2", "name": "Variable Rate Adoption", "src": [["Fertilizer Canada / Stratus Ag Research", "Fertilizer Canada / Stratus Ag Research", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "'Fertilizer Program in <crop>' slide of each crop", "2016–2025 (8 years)", ""]], "smooth": true, "about": {"unit": "Percentage of sampled farmland (hectares) or growers adopting the practice: all Basic 4R criteria for nitrogen and phosphorus (5.2.1), or variable rate technology on some or all fields (5.2.2).", "unit_short": "Percentage of sampled farmland (hectares) or growers adopting the practice: all Basic 4R criteria for nitrogen and phosphorus (5.2.1), or variable rate technology on some or all fields (5.2.2).", "calc": "% of Sampled Hectares = % of growers using variable rate technology on all fields + % using it on some fields, from Fertilizer Canada's Fertilizer Program analysis for that year", "naics": ""}}, {"page": "m_5_2_3", "code": "EN.5.2.3", "name": "Soil Testing Frequency", "src": [["Fertilizer Canada / Stratus Ag Research", "Fertilizer Canada / Stratus Ag Research", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "https://fertilizercanada.ca/our-focus/stewardship/fertilizer-use-survey/", "'Frequency of Soil Testing' slides (General Fertilizer Practices)", "2019–2025", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "% of all survey respondents in this region (all crops combined) who reported soil testing at least once every 3 years (the sum of the answers 'Every year', 'Every 2 years' and 'Every 3 years') in Fertilizer Canada's Frequency of Soil Testing analysis for that year", "naics": ""}}, {"page": "m_5_2_4", "code": "EN.5.2.4", "name": "Liquid Manure Application", "src": [["Land inputs, manure and irrigation, Census of Agriculture, 2021", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100368-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210036801", "Table 32-10-0368-01", "2021", ""]], "smooth": false, "about": {"unit": "Hectares (1 hectare = 10,000 square metres, about 2.5 acres).", "unit_short": "Hectares (1 hectare = 10,000 square metres, about 2.5 acres).", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}, {"page": "m_5_2_5", "code": "EN.5.2.5", "name": "Nutrient Use Efficiency", "src": [["OECD", "OECD", "https://data-explorer.oecd.org/vis?df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_AGRI_ENV%40DF_NB&df[ag]=OECD.TAD.ARP", "https://www.oecd.org/en/topics/sub-issues/agri-environmental-indicators.html", "Dataflow OECD.TAD.ARP:DSD_AGRI_ENV@DF_NB (Nutrients balances), REF_AREA CAN", "2012–2024", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Nutrient Outputs / Nutrient Inputs (both in Tonnes, from the source table), expressed as a percentage", "naics": ""}}]}, {"code": "En5.3", "name": "Responsible seed innovation and adoption", "planned": false, "metrics": [{"page": "m_5_3_1", "code": "EN.5.3.1", "name": "Introduction of New Seed Varieties", "src": [["Varieties of Crop Kinds Registered in Canada", "Canadian Food Inspection Agency", "https://open.canada.ca/data/en/dataset/d0d1d580-d54c-47bb-a767-78d78d57f027", "", "Variety registration list (regdate)", "2010–2025", ""]], "smooth": true, "about": {"unit": "Number of new crop varieties registered in the year.", "unit_short": "Number of new crop varieties registered in the year.", "calc": "Sum of variety-registration counts across all crop kinds in the major field-crop group, per year", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#6E8F57\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19.5 11 H28.5 M21 11 V20 L14 33.5 A2.2 2.2 0 0 0 16 37 H32 A2.2 2.2 0 0 0 34 33.5 L27 20 V11\"/><path d=\"M17 29 H31\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#6E8F57\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19.5 11 H28.5 M21 11 V20 L14 33.5 A2.2 2.2 0 0 0 16 37 H32 A2.2 2.2 0 0 0 34 33.5 L27 20 V11\"/><path d=\"M17 29 H31\"/><\/g><\/svg>", "teaser": "This indicator looks at how fertilizers, pest control products and other crop inputs are used and how they are managed.", "about": ["<p>This indicator looks at how fertilizers, pest control products and other crop inputs are used and how they are managed. It encompasses what is being used on Canadian farms and the adoption of best practices by farmers that improve environmental outcomes to soil, water and air, such as 4R nutrient stewardship (Right Source, Right Rate, Right Time, Right Place), nutrient use efficiency, variable rate application and soil testing. The aim is to improve productivity while reducing pressure on ecosystems. Because environmental outcomes are hard to measure at scale, this Indicator leverages proxy measures and practice adoption.<\/p>"], "observations": ["<p>Pesticide residues on food indicate whether pest control products are being used according to label directions, and therefore serve as an indicator of responsible use. Each year, the Canadian Food Inspection Agency (CFIA) tests domestic and imported foods for chemical residues and compares the results with the maximum residue limits (MRLs) set by Health Canada. Results for domestically produced fresh fruits and vegetables were selected because they reflect on-farm practices in Canada and are reported consistently over time. Compliance has remained high and stable, between 98.3% and 99.4% in each of the seven survey cycles since 2016–17 (<span class=\"ref\" title=\"Dashboard metric EN.5.1.1\">EN.5.1.1<\/span>). In the most recent cycle (2022–23), 9 of 1,289 samples exceeded an MRL.<\/p>", "<p>Adoption of 4R Nutrient Stewardship (right source, right rate, right time, right place) is measured through Fertilizer Canada’s Fertilizer Use Survey, as the share of sampled hectares managed under 4R practices. Results are reported by crop and region as published, because combining them into a single national value would reduce accuracy. Only 2024 and 2025 use the same survey method, so comparisons are limited to these two years. Adoption increased in most crop and region combinations (<span class=\"ref\" title=\"Dashboard metric EN.5.2.1\">EN.5.2.1<\/span>). In Ontario, adoption on corn hectares nearly doubled, from 7.8% to 14.5%. In Western Canada, it rose from 26.2% to 35.3% for canola and from 29.9% to 36.9% for spring wheat, and in Manitoba from 33.8% to 40.9% for feed barley. The largest change was for malt barley in Manitoba, which rose from 8.4% to 42.6%. A change of this size over one year may partly reflect the small number of farms sampled for this crop and region, and it should be confirmed in future survey cycles. Adoption declined only for grain corn in Quebec, from 11.2% to 3.2%.<\/p>", "<p>Variable rate fertilizer technology, which adjusts application rates within a field according to soil and yield variability, is used on a modest share of hectares, mostly between 7% and 20% across the crops and regions surveyed (<span class=\"ref\" title=\"Dashboard metric EN.5.2.2\">EN.5.2.2<\/span>). Trends differ between regions. In Western Canada, use has increased: for canola from 14.8% in 2019 to 19.5% in 2025, for spring wheat from 12.7% in 2016 to 17.4% in 2025, and for malt barley in Manitoba from 10.4% in 2022 to 19.4% in 2025. In Eastern Canada, use has declined: for corn in Ontario from 12.5% in 2019 to 8.6% in 2025, for winter wheat in Ontario from 9.0% in 2015 to 2.1% in 2025, and for grain corn in Quebec from 10.3% in 2022 to 7.7% in 2025. These regional differences may reflect differences in farm and field size, equipment and the nutrient management approaches commonly used for each crop, but the survey data do not identify the reasons.<\/p>", "<p>Soil testing frequency depends on crop rotation, soil type and other factors (<span class=\"ref\" title=\"Dashboard metric EN.5.2.3\">EN.5.2.3<\/span>). In Ontario, for example, provincial guidance recommends testing each field at least once every three years.<sup>1<\/sup> <sup>2<\/sup>In 2025, 82% of surveyed hectares in Manitoba and 70% in Western Canada were tested for nitrogen at least once every three years, compared with 47% in Ontario and 36% in Quebec. Annual testing is most common in Western Canada, where the share of hectares tested for Nitrogen every year rose from 30% in 2019 to 45% in 2025, and it reaches 62% in Manitoba. In Ontario, most testing follows a three-year cycle, with only 3% of hectares tested every year. Testing for pH, phosphorus and potassium follows a similar pattern, although Ontario’s three-year testing is higher for these nutrients, at 65% of hectares.<\/p>", "<p>Many producers use manure alongside commercial fertilizer as a source of nutrients, and good nutrient management accounts for both when matching nutrient supply to crop needs. The 4R principles also apply to manure, but the 4R adoption data reported here mainly reflect commercial fertilizer practices. Manure application methods help fill that gap. In 2021, liquid manure was applied to about 1.18 million ha, and on 58% of that area (682,433 ha) the manure was injected or incorporated into the soil (<span class=\"ref\" title=\"Dashboard metric EN.5.2.4\">EN.5.2.4<\/span>). These methods are generally considered good nutrient management practices because they help retain nutrients in the soil and reduce odour and nutrient losses. The remaining 499,637 ha received surface application, which generally increases the potential for nitrogen losses through ammonia volatilization. Data are available for only one year, so no trend can yet be assessed.<\/p>", "<p>Nutrient use efficiency, the share of applied nutrients removed by harvested crops, varies from year to year, mainly with growing conditions (<span class=\"ref\" title=\"Dashboard metric EN.5.2.5\">EN.5.2.5<\/span>). Nitrogen use efficiency ranged from 62% to 81% between 2012 and 2024. It was lowest in 2021, when drought reduced yields and therefore the nitrogen removed by crops, and highest in 2022, and it has remained above 76% for the last three years. Nitrogen inputs held at about 5 million tonnes per year, while crop removal increased from 3.2 million tonnes in 2012 to 4.1 million tonnes in 2024. Phosphorus use efficiency ranged from 83% to 116% and has been above 100% since 2022. This means crops removed more phosphorus than was applied, drawing down soil phosphorus reserves, which over time could affect soil fertility if it continues.<\/p>", "<p>New crop variety registrations are concentrated in oilseeds, at 58 to 214 per year, compared with 6 to 45 for each of the other major crop groups (<span class=\"ref\" title=\"Dashboard metric EN.5.3.1\">EN.5.3.1<\/span>). Soybeans account for most of these, with up to 181 registrations per year, and canola for 12 to 40. Oilseed registrations peaked at 214 in 2023 and were 62 in 2025. Registrations show that new varieties are being developed, but they do not indicate which traits, such as drought tolerance or disease resistance, are being targeted, or how widely the varieties are adopted by producers. As a result, the effect of new varieties on yields cannot yet be assessed (<span class=\"ref\" title=\"Dashboard metric EC.5.1.1\">EC.5.1.1<\/span>). For example, canola yields rose by about 32% between 2010 and 2025, from 1,900 to 2,507 kg/ha, while soybean yields remained at about 3,000 kg/ha despite soybeans having the most registrations. Weather has a strong influence on yields, as shown by the drop in canola yields to 1,593 kg/ha during the 2021 drought.<\/p>"], "limitations": ["<p>Practice adoption data are limited in time and coverage. Fertilizer Canada’s survey method for 4R adoption has changed over time, and only the two most recent years (2024 and 2025) use the same approach, so no trend can yet be established. Results are reported as the share of sampled hectares meeting all basic 4R criteria for nitrogen and phosphorus, for six crop and region combinations across four regions. They are presented as published, because combining them into a weighted national value could misrepresent actual adoption. As a result, the data are not national, and large single-year changes, such as the increase for malt barley in Manitoba, cannot be checked against earlier years. Sample sizes for some crop and region combinations may also be small. Variable rate technology and soil testing data likewise cover a limited set of crops and regions, and liquid manure application data are available for a single year.<\/p>", "<p>Practice measures do not show environmental outcomes. The indicator tracks the adoption of practices and a national nutrient balance, but not the nutrient losses that affect soil, water and air, such as nitrogen leaching, nitrous oxide emissions or phosphorus runoff. A national nutrient balance can also mask regional differences, with surpluses in some areas and deficits in others.<\/p>", "<p>The pest control measure has a narrow scope. Residue compliance covers domestically produced fresh fruits and vegetables only, and does not reflect field crops such as grains and oilseeds, which account for most cropland. It shows whether residues remain within limits, not how pest control decisions are made.<\/p>", "<p>The link between inputs, productivity and environmental performance is not yet established and would likely require more in-depth study. New variety registrations do not track yields (<span class=\"ref\" title=\"Dashboard metric EC.5.1.1\">EC.5.1.1<\/span>), and publicly available national data do not link seeded area to specific varieties, so the effect of new varieties cannot be separated from changes in crop area or weather. The registration data also do not identify the traits that new varieties are intended to improve.<\/p>"], "opportunities": ["<p>Residue compliance shows the outcome of following label directions, but not how pest control decisions are made on the farm. A measure of integrated pest management (IPM) adoption would help fill that gap. IPM combines several methods, such as pest monitoring and cultural, biological and chemical controls, to manage pests effectively while limiting risks to people and the environment. Combined with residue results for food and water, IPM adoption would show how pest control decisions are made, whether products are used within their limits and whether residues are reaching the environment. Extending residue reporting to field crops would also improve coverage.<\/p>", "<p>For nutrient management, extending the 4R, variable rate and soil testing series over more years, crops and regions would allow trends to be identified. The survey also reports other practices that could be added, such as the use of enhanced efficiency fertilizers, which reduce nitrogen losses. Repeating the liquid manure survey would make it possible to track change over time.<\/p>", "<p>Outcome measures would complement practice adoption. AAFC’s agri-environmental indicators for residual soil nitrogen and the risk of water contamination by phosphorus estimate nutrient surpluses and potential losses by region, and could show whether improved practices are reducing environmental pressure.<\/p>", "<p>For new varieties, data on the area seeded to each variety, available in some provinces through crop insurance programs, would show which varieties are being adopted. Information on the traits that new varieties target, such as drought tolerance or disease resistance, would help link innovation to productivity and resilience.<\/p>"], "notes": ["Ontario Ministry of Agriculture, Food and Agribusiness, Soil Testing;", "<a href=\"https://www.ontario.ca/files/2022-10/omafra-agronomy-guide-for-field-crops-chapter-9-en-2022-10-13.pdf\" rel=\"noopener\" target=\"_blank\"><em>Agronomy Guide for Field Crops<\/em>, Chapter 9: Soil Fertility and Nutrient Use<\/a>"]}, "EN.6": {"code": "EN.6", "dash": "6", "title": "Food Loss & Waste", "block": "env", "page": "ind_6", "metrics": 3, "groups": [{"code": "En6.1", "name": "Reduce", "planned": false, "metrics": [{"page": "ind_6", "code": "EN.6.1.1", "name": "Avoidable Food Loss and Waste", "src": [["Second Harvest / Value Chain Management International", "Second Harvest and Value Chain Management International", "https://cdn.prod.website-files.com/6618114bae6895cc12d3dc1d/671695f108d9e689b40723a0_acfw-technical-updated.pdf", "https://www.secondharvest.ca/research/avoidable-crisis-updated", "Figure 3-2 (p.21)", "2024", ""]], "smooth": false, "about": {"unit": "Million metric tonnes.", "unit_short": "Million metric tonnes.", "calc": "Sum of Figure 3-2's Preharvest + Storage/Grading + Processing/Manufacturing avoidable FW data labels (Million Tonnes)", "naics": ""}}]}, {"code": "En6.2", "name": "Repurpose", "planned": false, "metrics": [{"page": "m_6_2_2", "code": "EN.6.2.2", "name": "Use of by-products for animal feed", "src": [["Animal Nutrition Association of Canada (ANAC)", "Animal Nutrition Association of Canada (ANAC)", "https://www.anacan.org/feed-industry/public-resources/fundamentals-of-the-commercial-feed-industry", "https://www.anacan.org/feed-industry/public-resources/fundamentals-of-the-commercial-feed-industry", "Page 6", "2025", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "% of this crop's Canadian production used by the feed industry, taken directly from page 6's narrative text, no aggregation applied", "naics": ""}}, {"page": "m_6_2_3", "code": "EN.6.2.3", "name": "Use of by-products for animal feed", "src": [["Crushing statistics of major oilseeds, Canada and United States", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100127-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210012701", "Table 32-10-0127-01", "2017–2025", ""]], "smooth": true, "about": {"unit": "Million metric tonnes.", "unit_short": "Million metric tonnes.", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#6E8F57\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 16 H33.5 M21 16 V12.5 H27 V16\"/><path d=\"M16.5 16 L18 36.5 H30 L31.5 16\"/><path d=\"M22 21 V31.5 M26 21 V31.5\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#6E8F57\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 16 H33.5 M21 16 V12.5 H27 V16\"/><path d=\"M16.5 16 L18 36.5 H30 L31.5 16\"/><path d=\"M22 21 V31.5 M26 21 V31.5\"/><\/g><\/svg>", "teaser": "This indicator looks at how much food is lost or wasted in the agri-food system, and how losses are prevented or put to other uses.", "about": ["<p>This indicator looks at how much food is lost or wasted in the agri-food system, and how losses are prevented or put to other uses. The focus is on losses before the consumer: on the farm, in storage, processing and transport, and at retail. It covers two ideas, preventing loss and diverting what is lost, for example to animal feed, compost or upcycled products. It ties into national and global targets, including halving food loss by 2030. Consumer-level waste is out of scope, and there is no standard way yet to measure loss at every stage.<\/p>"], "observations": ["<p>Food loss and waste in Canada is considerable. The latest national study estimates that 21.2 million tonnes of food, about 46.5% of all food produced for Canada, is lost or wasted each year, including inedible parts such as bones and peels<sup>1<\/sup>. About 42% of this (8.8 million tonnes) is avoidable, meaning it was edible at some point, with a value of about $58 billion and about 25.7 million tonnes of CO2e in associated greenhouse gas emissions.<\/p>", "<p>Within this indicator’s scope (before the consumer), avoidable food loss and waste was estimated at 6.67 million tonnes (<span class=\"ref\" title=\"Dashboard metric EN.6.1.1\">EN.6.1.1<\/span>). About two thirds of it, 4.39 million tonnes, is lost upstream in preharvest, storage and grading, and processing, with processing and manufacturing the largest single stage at 2.81 million. Distribution and retail add 2.28 million tonnes. The same source also estimates 0.67 million tonnes at restaurants, hotels and institutions and 1.48 million at households, which sit outside this indicator’s scope. The study reports that total food loss and waste fell by about 20% from its 2019 estimate, although differences in method between the two studies make the comparison uncertain.<\/p>", "<p>Animal feed is also an important destination for Canadian grain. In 2025 the domestic feed industry used 80% of Canadian barley, 60% of corn and 30% of wheat production (<span class=\"ref\" title=\"Dashboard metric EN.6.2.2\">EN.6.2.2<\/span>). That grain becomes meat, milk, eggs and other animal products. While animal feed is an important destination for Canadian grain, livestock also make use of large quantities of co-products and by-products from other industries, which supports a circular bioeconomy and reduces waste<sup>2<\/sup>.<\/p>", "<p>Oilseed crushing results in by-products that also go to feed. Canola meal production reached 6.79 million tonnes in 2025, up 32.7% from 2017, while soybean meal held between 1.2 and 1.6 million tonnes and came in at 1.22 million tonnes in 2024, its lowest level over this period (<span class=\"ref\" title=\"Dashboard metric EN.6.2.3\">EN.6.2.3<\/span>).⁴ Using the meal for livestock feed puts to work what is left after the oil is extracted. These volumes shouldn’t be compared directly with the food loss estimates, because the two are counted on different bases.<\/p>"], "limitations": ["<p>Canada has no regular, official national measure of food loss or food waste. Food loss (on farms, in storage, processing and transport) and food waste (at retail, in food service and in households) are not measured through any recurring national survey or statistical program. What exists comes from one-off studies that use different definitions, stages and methods <sup>3<\/sup><sup>,<\/sup><sup>4<\/sup>. Results from different studies therefore can’t be compared or combined into a time series.<\/p>", "<p>The Food Loss and waste figures presented in the National Index on Agri-Food Performance are based on the most recent available report from Second Harvest published in 2024<sup>5<\/sup>. At this time, no information is available regarding a future update. The Reduce estimates (4.39 million tonnes before distribution, 2.28 million at distribution and retail) come from a report that relies on a 2019 baseline, while the 2025 National Index<sup>6<\/sup> describes them as modelled on 2020 data.<\/p>", "<p>Two Repurpose metrics, government waste-reduction funding and non-marketable wheat used for feed, were not updated in the 2025 cycle. This data may be a one-off, and future updates of the Food Waste Reduction Challenge, which feeds the Repurpose sub-indicator, remain uncertain.<\/p>", "<p>With one snapshot there is no trend, so the data cannot yet show progress toward the national and global goal of halving food loss and waste by 2030.<\/p>", "<p>Coverage is narrower than the scope. The indicator is meant to cover avoidable and unavoidable (inedible) loss, and diversion to animal feed, compost, upcycled products, biofuels and anaerobic digesters. The data cover avoidable loss only, diversion only through animal feed (grain shares and oilseed meal), and nothing on prevention initiatives. Data on co-products and by-products fed to livestock are limited. Partners note that cattle consume substantial volumes of these materials, but the amounts are hard to measure because supply varies with the output of the industries that produce them. Better data on these volumes would show more fully how much material the livestock sector keeps in use.<\/p>", "<p>Comparisons with global data are unreliable. FAO Food Systems Dashboard figures for cereal, pulse, vegetable and fruit loss put Canada above the world average, which partners find counterintuitive and want investigated.<\/p>"], "opportunities": ["<p>The most significant gap is the lack of national data. A recurring national measurement of food loss and food waste would provide the indicator with a reliable baseline and trend. Ideally, this measurement would be led or coordinated by Statistics Canada and apply a consistent method across all stages of the supply chain. Aligning it with international methods, such as the Food Loss and Waste Accounting and Reporting Standard and the FAO Food Loss Index and UNEP Food Waste Index used to report on SDG Target 12.3, <sup>7<\/sup> would also allow more reliable comparisons with other countries. Ongoing work toward a national voluntary standard for food loss and waste, supported by Agriculture and Agri-Food Canada, could provide common definitions to support this measurement.<sup>8<\/sup><\/p>", "<p>Until national data are available, regular updates of the Reduce estimates and Repurpose metrics would help show whether food loss and waste is declining. The current picture focuses on avoidable loss and a single diversion route. Including unavoidable loss, and other diversion routes such as composting, anaerobic digestion and upcycled products, would show more fully how much material is kept in use. Improved tracking of the co-products and by-products used in livestock feed would also strengthen the indicator. Prevention initiatives, and the policies and funding programs that support them, are also worth capturing, as they show what is driving change.<\/p>", "<p>Comparisons with global figures also require further examination. A closer review of the methodology behind the FAO Food Systems Dashboard would show whether Canadian and global figures are sufficiently aligned to be compared with confidence.<\/p>"], "notes": ["Gooch, M., Nikkel, L., Bucknell, D., Marchildon, J., LaPlain, D., Whitehead, P. and Chin Sang, G. (2024). <em>The Avoidable Crisis of Food Waste: Update – Technical Report<\/em>. Second Harvest and Value Chain Management International.", "Ominski, K. et al. (2021). Utilization of by-products and food waste in livestock production systems: a Canadian perspective. <em>Animal Frontiers<\/em> 11(2): 55–63", "<a href=\"https://www.canada.ca/content/dam/eccc/food-loss-and-waste/Taking%20Stock%20Report%20EN%20Final.pdf\" rel=\"noopener\" target=\"_blank\">Environment and Climate Change Canada (2019). Taking Stock: Reducing Food Loss and Waste in Canada<\/a>;", "Gooch, M. et al. (2019). The Avoidable Crisis of Food Waste: Technical Report. Value Chain Management International and Second Harvest<br/> ²World Resources Institute et al. (2016). Food Loss and Waste Accounting and Reporting Standard (FLW Standard); FAO, Food Loss Index (SDG indicator 12.3.1a); UNEP, Food Waste Index (SDG indicator 12.3.1b).", "Gooch, M., Nikkel, L Bucknell, D., Marchildon, J. LaPlain, D., Whitehead, P., Chin Sang, G. (2024). The Avoidable Crisis of Food Waste Update; Second Harvest and Value Chain Management International; Ontario, Canada", "<a href=\"https://cdn.prod.website-files.com/616745ce30790127aaa8b000/6926145aa9469ae7b61bceaf_421591824ec06e9eeb0c62d886e13659_National%20Index%20on%20Agri-Food%20Performance%202025.pdf\" rel=\"noopener\" target=\"_blank\">Centre for Agri-Food Benchmarking (2025). National Index on Agri-Food Performance Update<\/a>", "World Resources Institute et al. (2016). Food Loss and Waste Accounting and Reporting Standard (FLW Standard); FAO, Food Loss Index (SDG indicator 12.3.1a); UNEP, Food Waste Index (SDG indicator 12.3.1b).", "<a href=\"https://search.open.canada.ca/qpnotes/record/aafc-aac%2CAAFC-2025-QP-00138\" rel=\"noopener\" target=\"_blank\">Agriculture and Agri-Food Canada, Question Period Note: Food Waste (December 2025<\/a>)"]}, "EN.7": {"code": "EN.7", "dash": "7", "title": "Packaging & Waste", "block": "env", "page": "ind_7", "metrics": 4, "groups": [{"code": "En7.1", "name": "Reduce / recycle", "planned": false, "metrics": [{"page": "ind_7", "code": "EN.7.1.1", "name": "Pesticide and Fertilizer Container Recycling", "src": [["Cleanfarms", "Cleanfarms", "https://cleanfarms.ca/", "https://cleanfarms.ca/", "Slide 18: All Provinces - Small Containers (# KG)", "2011–2025", ""]], "smooth": true, "about": {"unit": "Thousand tonnes.", "unit_short": "Thousand tonnes.", "calc": "Value taken directly from the source chart's data label (Kilograms), converted to Kilotonnes (divide by 1,000,000); no other aggregation applied", "naics": ""}}, {"page": "m_7_1_2", "code": "EN.7.1.2", "name": "Plastic Recycling", "src": [["Waste materials diverted, by type and by source", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/38100179-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3810017901", "Table 38-10-0179-01", "2018–2024 (5 years)", ""]], "smooth": true, "about": {"unit": "Metric tonnes (1 tonne = 1,000 kilograms).", "unit_short": "Metric tonnes (1 tonne = 1,000 kilograms).", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}, {"page": "m_7_1_3", "code": "EN.7.1.3", "name": "Fertilizer and Pesticide Small Containers, Recycling Rate", "src": [["Cleanfarms", "Cleanfarms", "https://cleanfarms.ca/", "https://cleanfarms.ca/", "Slide 25: Collection Rate, Small Containers", "2013–2025", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Manually transcribed from the source chart's data label (slide 25, embedded as a picture rather than extractable text); no aggregation applied", "naics": ""}}]}, {"code": "En7.2", "name": "Reuse", "planned": true, "metrics": [{"page": "m_7_2_1", "code": "EN.7.2.1", "name": "Reuse", "src": [], "smooth": false, "about": {"unit": "", "unit_short": "", "calc": "", "naics": "", "note": "No data yet. This sub-indicator is planned for the Index; no metric is available to report so far."}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#6E8F57\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M33.5 20.5 A10 10 0 0 0 15.2 19.5\"/><path d=\"M14.5 13.5 V19.8 H20.8\"/><path d=\"M14.5 27.5 A10 10 0 0 0 32.8 28.5\"/><path d=\"M33.5 34.5 V28.2 H27.2\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#6E8F57\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M33.5 20.5 A10 10 0 0 0 15.2 19.5\"/><path d=\"M14.5 13.5 V19.8 H20.8\"/><path d=\"M14.5 27.5 A10 10 0 0 0 32.8 28.5\"/><path d=\"M33.5 34.5 V28.2 H27.2\"/><\/g><\/svg>", "teaser": "This indicator looks at how packaging and plastic waste is generated, managed and reduced across the agri-food system, using the reduce, reuse and recycle framework.", "about": ["<p>This indicator looks at how packaging and plastic waste is generated, managed and reduced across the agri-food system, using the reduce, reuse and recycle framework. It covers on-farm plastics such as pesticide containers and grain bags, as well as packaging used in processing and retail. It tracks diversion, recycling and uptake of circular practices, in support of national commitments on plastic waste. It does not yet measure reuse at scale or capture every type of packaging.<\/p>"], "observations": ["<p>Collection of small pesticide and fertilizer containers (up to 23 L) has improved, although not in a straight line. Proper collection prevents empty containers from being burned or buried on farms, which can release pesticide residues and other pollutants into soil, air and water. Cleanfarms<sup>1<\/sup> runs a national program, through agri-retailers and municipalities, that collects empty, rinsed containers from farms and recycles them into products such as agricultural drainage tile. The collection rate compares the amount collected with the amount sold into the market, as a three-year moving average updated each year. It was 66% in 2013, remained at about 61% to 62% from 2014 to 2017, and has increased since 2018, reaching 88% in 2025, with a single decline in 2022, from 77% to 73% (<span class=\"ref\" title=\"Dashboard metric EN.7.1.3\">EN.7.1.3<\/span>). Cleanfarms describes this rate as one of the highest in the world for crop input containers. The weight collected rose by 53%, from 1.63 kilotonnes in 2011 to 2.50 kilotonnes in 2025 (<span class=\"ref\" title=\"Dashboard metric EN.7.1.1\">EN.7.1.1<\/span>), including a 13% increase from 2024 to 2025. Since the program began, about 61 million kg of small containers have been collected.<\/p>", "<p>Collection of larger containers and other farm plastics shows a similar trend, although these are not yet included in this indicator. In 2025, Cleanfarms collected 109,000 bulk totes and drums (24 to 1,000 L), an increase of 13% from 2024, with a three-year average collection rate of 63%. In Saskatchewan, where a provincially regulated program collects used grain bags, 1.65 million kg were collected in 2025.<sup>2<\/sup><sup>3<\/sup><\/p>", "<p>Results for plastics more broadly are less positive (<span class=\"ref\" title=\"Dashboard metric EN.7.1.2\">EN.7.1.2<\/span>).[3] This series covers all plastics diverted from disposal in Canada, not only agri-food packaging. Residential plastics diversion declined from 230,777 tonnes in 2018 to 198,756 tonnes in 2022, then recovered to 235,198 tonnes in 2024, about 1.9% above the 2018 level. Non-residential diversion, which includes industrial, commercial and institutional sources such as food processing and retail, fell from 97,813 tonnes in 2018 to 66,883 tonnes in 2024, a decline of 31.6%. This is the only measure in the packaging and waste indicator that shows a clear decline.<\/p>"], "limitations": ["<p>Cleanfarms now reports small container collection by weight (kilograms) rather than by number of containers, and the container series in this indicator (<span class=\"ref\" title=\"Dashboard metric EN.7.1.1\">EN.7.1.1<\/span>) uses this measure. The collection rate (<span class=\"ref\" title=\"Dashboard metric EN.7.1.3\">EN.7.1.3<\/span>) is a three-year moving average updated each year, which smooths year-to-year changes, so recent shifts appear only gradually.<\/p>", "<p>The collection rate measures collection rather than recycling. Cleanfarms reports what collected containers are made into, but, except for bulk containers, not how much material is actually recycled after processing. The share of the total agricultural container market covered by the program is also not published. In addition, bulk containers, grain bags and other farm plastics collected by Cleanfarms are not yet included in the indicator.<\/p>", "<p>The reduce and reuse dimensions are not measured. No data were found for the Reuse sub-indicator, even though it was identified in 2023, and there is no measure of the amount of packaging generated, which would be needed to track reduction. The three metrics in this indicator therefore reflect collection and diversion only.<\/p>", "<p>Collection volumes differ by region, partly because provincial rules differ. Some Cleanfarms programs are regulated or fall under extended producer responsibility (EPR) requirements in certain provinces, while others are voluntary or operate as pilots. National totals and trends therefore combine results from different regulatory frameworks.<\/p>", "<p>Coverage is narrower than the indicator’s intended scope. The plastics diversion series (<span class=\"ref\" title=\"Dashboard metric EN.7.1.2\">EN.7.1.2<\/span>) covers all plastics diverted in Canada, not only agri-food packaging, so the sector’s contribution cannot be separated. The series begins in 2018 and does not explain the causes of change, such as the decline in non-residential diversion. Packaging used in food processing and retail is not measured.<\/p>"], "opportunities": ["<p>Agri-specific plastics are the most ready addition. Cleanfarms already reports collection of bulk pesticide and fertilizer containers, grain bags and twine, including a collection rate for bulk containers and a regulated grain bag program in Saskatchewan. Adding these series would cover on-farm plastics beyond small containers. Showing collection results next to each province’s extended producer responsibility (EPR) rules would help explain why recovery differs across the country.<\/p>", "<p>The indicator could also look beyond collection. Data on how much collected material is actually recycled would show whether collection translates into recovery. A measure of packaging used in processing and retail would extend the indicator further along the supply chain, and provincial EPR programs for packaging may become a source for it as they report more data.<\/p>", "<p>Reuse is the clearest gap, since it still has no metric at all. Measuring it would likely take dedicated discussions with researchers and small and medium-sized businesses working in this space, possibly through a separate project to explore how reuse could be tracked.<\/p>", "<h1 id=\"food-integrity\">FOOD INTEGRITY<\/h1>"], "notes": ["Cleanfarms is a non-profit stewardship organization whose members include crop input and animal health companies. It collects agricultural plastics and products across Canada, including empty pesticide and fertilizer containers, and publishes annual results by program and province.", "<a href=\"https://cleanfarms.ca/wp-content/uploads/2026/05/2025-cleanfarms-annual-report.pdf;\" rel=\"noopener\" target=\"_blank\">Cleanfarms (2026). 2025 Cleanfarms Annual Report<\/a>", "<a href=\"https://cleanfarms.ca/cleanfarms-reports-record-setting-collections-for-canadian-agricultural-plastics-recovery/\" rel=\"noopener\" target=\"_blank\">Cleanfarms (2026). Cleanfarms reports record-setting collections for Canadian agricultural plastics recovery<\/a>"]}, "EC.1": {"code": "EC.1", "dash": "14", "title": "National Economic Contribution", "block": "eco", "page": "ind_14", "metrics": 16, "groups": [{"code": "Ec1.1", "name": "GDP", "planned": false, "metrics": [{"page": "ind_14", "code": "EC.1.1.1", "name": "Gross Domestic Production (GDP)", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2011–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Sum of the 8 agri-food sub-sector values for each Geo/year (source no longer includes an 'All industries' aggregate row for the agri-food sector specifically)", "naics": ""}}, {"page": "m_14_1_2", "code": "EC.1.1.2", "name": "Gross Domestic Product (GDP) - Primary Agriculture", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2010–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Yearly average of the summation of all monthly values", "naics": "Primary Agriculture = 11A Crop and animal production (111 Crop production + 112 Animal production and aquaculture) | Primary agriculture = NAICS 11A (crop and animal production: 111 + 112)."}}, {"page": "m_14_1_3", "code": "EC.1.1.3", "name": "Gross Domestic Product (GDP) - Food And Beverage Processing", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2010–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Yearly average of the summation of all monthly values across: Food manufacturing [311]; Beverage and tobacco product manufacturing [312]", "naics": "Food and beverage processing = NAICS 311 (food manufacturing) + NAICS 312 (beverage and tobacco product manufacturing); the two annual averages are added."}}, {"page": "m_14_1_4", "code": "EC.1.1.4", "name": "Gross Domestic Product (GDP) - Food wholesaling: Food, beverage and tobacco wholesaler-distributors", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2011–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Yearly average of the summation of all monthly values", "naics": "Food wholesaling = NAICS 413 (food, beverage and tobacco merchant wholesalers) only; NAICS 411 (farm product merchant wholesalers) is part of the EC.1.1.1 total but is not reported in this metric."}}, {"page": "m_14_1_5", "code": "EC.1.1.5", "name": "Gross Domestic Product (GDP) - Food retailing: Food and beverage stores", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2011–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Yearly average of the summation of all monthly values", "naics": "Food retailing = NAICS 445 (food and beverage retailers; named 'Food and Beverage Stores' before NAICS 2022)."}}, {"page": "m_14_1_6", "code": "EC.1.1.6", "name": "Gross Domestic Product (GDP) - Food service and restaurants: Food services and drinking places", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2010–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "unit_short": "Billions of dollars adjusted to 2017 prices (chained dollars), so changes reflect volumes of output rather than price changes.", "calc": "Yearly average of the summation of all monthly values", "naics": "Food service and restaurants = NAICS 722 (food services and drinking places)."}}, {"page": "m_14_1_7", "code": "EC.1.1.7", "name": "Gross Domestic Product (GDP) - Pesticide, fertilizer and other agricultural chemical manufacturing", "src": [["Gross domestic product (GDP) at basic prices, by industry, monthly", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100434-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610043401", "Table 36-10-0434-01", "2010–2026", ""]], "smooth": true, "about": {"unit": "Billions of dollars adjusted to 2017 price serve, annual", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/14100469-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410046901", "Table 14-10-0469-01", "2010–2025", ""]], "smooth": true, "about": {"unit": "Number of people.", "unit_short": "Number of people.", "calc": "Value taken directly from the source table, no aggregation applied", "naics": "111-112, 1100, 1151-1152, 21, 113-114, 1153, 2100, 22 Agriculture, natural resources, and utilities | One combined group, 'Agriculture, natural resources and utilities', which the table defines as NAICS 111-112, 1100, 1151-1152 (agriculture), 21 and 2100 (mining and oil and gas), 113-114 and 1153 (forestry, fishing and support) and 22 (utilities)."}}, {"page": "m_14_2_4", "code": "EC.1.2.4", "name": "Employment, sector share", "src": [["Employment by industry, monthly, unadjusted for seasonality", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/14100201-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410020101", "Table 14-10-0201-01", "2010–2026", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Yearly average of Food manufacturing [311] + Beverage and tobacco product manufacturing [312] divided by the yearly average of Manufacturing [31-33], x100", "naics": "Employment shares from Table 14-10-0201-01 (all employees), using annual averages of the monthly counts: 'Food Processing as a percent of all manufacturing' = (NAICS 311 + 312) / Manufacturing [31-33] x 100; 'Food retail as a percent of all retail sector' = NAICS 445 / Retail trade [44-45] x 100."}}]}, {"code": "Ec1.3", "name": "Trade balance", "planned": false, "metrics": [{"page": "m_14_3_1", "code": "EC.1.3.1", "name": "Agri-Food Sector Trade", "src": [["Trade Data Online", "Innovation, Science and Economic Development Canada", "https://ised-isde.canada.ca/site/trade-data-online/en", "", "Query: Canada, all countries, NAICS industries, latest 10 years", "2016–2025", ""]], "smooth": true, "about": {"unit": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "unit_short": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "calc": "'Total exports': sum of NAICS 111, 112, 311 and 312's export values for each year (this file). 'Trade balance': sum of the same categories' (or, for 'Food and beverage processing', just NAICS 311 and 312's) 'Trade Balance' values for each year, from '14_3_4 Trade Balance (Canada Trade Balance).csv'", "naics": "Agri-Food Sector = 111 Crop production + 112 Animal production and aquaculture + 311 Food manufacturing + 312 Beverage and tobacco product manufacturing | 'Agri-Food Sector' bundles NAICS 111 (crop production), 112 (animal production and aquaculture), 311 (food manufacturing) and 312 (beverage and tobacco product manufacturing): Total exports = sum of the four NAICS export values (file 14_3_1 Trade balance (by Industry)); Trade balance = sum of the four NAICS trade balances (exports minus imports, file 14_3_4 Canada Trade Balance). | 'Food and beverage processing' = NAICS 311 + 312 trade balance only. | NAICS 3253, 33311 and 41315, also present in the files, are not used."}}, {"page": "m_14_3_2", "code": "EC.1.3.2", "name": "Total exports relative to all Canadian exports", "src": [["Trade Data Online", "Innovation, Science and Economic Development Canada", "https://ised-isde.canada.ca/site/trade-data-online/en", "", "Query: Canada, all countries, NAICS industries, latest 10 years", "2016–2025", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "EC.1.3.1's 'Agri-Food Sector' Total exports (sum of NAICS 111, 112, 311 and 312's export values) divided by the matching year's total in '14_3_1 Trade Balance (All Industries).xls', x100", "naics": ""}}, {"page": "m_14_3_3", "code": "EC.1.3.3", "name": "Canadian agri-food exports relative to global trade", "src": [["Trade Data Online (Canadian agri-food exports, US dollars)", "Innovation, Science and Economic Development Canada", "https://ised-isde.canada.ca/site/trade-data-online/en", "", "Trade Data Online query (USD)", "2016–2024", ""], ["UN Comtrade: world exports of SITC food, beverages and tobacco", "United Nations Statistics Division (UN Comtrade)", "", "https://comtradeplus.un.org/", "UN Comtrade bulk export: exports, partner World, SITC Rev. 4 sections 'Food and live animals' and 'Beverages and tobacco'", "2016–2024", "World exports (denominator)"]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Sum of NAICS 111, 112, 311 and 312's export values for each year from '14_3_3 Trade Balance (by Industry US Dollar for FAO calc).xls' (the same 4 categories as EC.1.3.1, in US dollars), divided by the matching year's global total (sum of 'Export' flow 'primaryValue' across all ~190 reporting countries and both commodity sections -- 'Food and live animals' and 'Beverages and tobacco' -- with partner 'World') in '14_3_3 Trade Balance(COMTRADE).csv', x100", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#D9A23E\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 12.5 V35.5 H36\"/><path d=\"M17 30 L22.5 24 L27 27 L34 18.5\"/><path d=\"M29 18.5 H34 V23.5\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#D9A23E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 12.5 V35.5 H36\"/><path d=\"M17 30 L22.5 24 L27 27 L34 18.5\"/><path d=\"M29 18.5 H34 V23.5\"/><\/g><\/svg>", "teaser": "The National Economic Contribution indicator assesses the overall economic significance and contribution of Canada’s agriculture and agri-food sector to the national economy.", "about": ["<p>The National Economic Contribution indicator assesses the overall economic significance and contribution of Canada’s agriculture and agri-food sector to the national economy. This includes the agriculture, food, beverage and tobacco manufacturing, farm and food wholesale, retail and foodservice industries, as well as some farm input industries, such as pesticides, fertilizers and other agricultural chemicals, which were added to the Index this year.<\/p>", "<p>This indicator describes the sector’s economic contribution to the national economy using data on gross domestic product (GDP), employment, and trade in absolute and relative terms. These indicators align with other indicators in the Economic block by emphasizing measurable economic outcomes and performance at the national level.<\/p>"], "observations": ["<p>Canada’s agriculture and agri-food (AAF) sector continues to grow, both in dollar terms and as a share of the overall economy. GDP of the sector’s players (agriculture, food, beverage and tobacco manufacturing (FBT), food wholesale, retail and food service and some inputs) rose to almost $150 billion in 2025 from $146 billion in 2024, up 2.1%. It accounted for the same share of the total economy as last year, at 6.4%.<\/p>", "<p>Most of this growth in GDP was attributable to higher agriculture output, up 9.1% year on year to $38.3 billion, to account for the largest share of AAF sector GDP. This is the first time agriculture GDP has exceeded that of FBT manufacturing, which fell 2.8% to $36.5 billion in 2025. However, FBT manufacturing still accounts for the largest share of manufacturing GDP at 18.2% of the total, unchanged from 2024. GDP in food retailing and foodservices grew modestly, by 0.8% and 0.7% respectively, while that of food wholesaling was up 3 % and farm product wholesaling was up 7.6% over 2024. GDP of pesticides, fertilizers and other ag chemicals was down 9.1% in 2025.<\/p>", "<p>Employment in the agriculture and agri-food (AAF) sector fell modestly in 2025 (-0.8%) to 2,299,587 from 2,317,421 a year earlier, despite the increase in sector output. Employment in all industries in the sector fell except for food manufacturing, which was up 0.6%. The agriculture and agri-food sector depends to a great extent on temporary and immigrant labour which due to the change in immigration policy in 2025, led to lower employment levels. At the same time, the number of indigenous individuals employed in agriculture, natural resources and utilities who do not live on reserves continues to increase to 45,100 in 2025, from 44,000 in 2024, up 2.5%, supported by concerted efforts to promote indigenous agriculture in Canada.<\/p>", "<p>Canadian trade in agriculture and agri-food products has been impacted by geopolitical uncertainty and disruptive trade policies in the U.S. and elsewhere. Nevertheless, agriculture and agri-food (AAF) exports rose to $99.6 billion in 2025, up 0.7%. However, imports rose by more, to $74.7 billion so that the trade balance fell 11.9% to $25.2 billion in 2025. Yet as a share of total Canadian exports, the sector’s share remained unchanged at 12.8%. As a share of global trade, Canada’s AAF exports also fell to 4.25%.<\/p>"], "limitations": ["<p>This indicator measures the AAF sector’s significance and contribution to the Canadian economy at an aggregate level so does not provide information about individual farm and food businesses, or profitability at the firm level, or to reflect more detailed regional disparities. It also does not evaluate environmental or social trade-offs associated with economic growth which would help link economic to environmental and social sustainability indicators better.<\/p>"], "opportunities": ["<p>Most metrics included in this indicator are available from Statistics Canada on a regular basis, and have fairly high levels of confidence, given their importance for estimating Canadian economic activity. However, data for some of the industries included in the agri-food system measuring agri-business activity or farm inputs, are not as easily available. Given the role of rising costs of inputs and the changing nature of agri-businesses to include more agri-tech businesses, the indicator would benefit from better data for these sub-industries in determining the sector’s significance and contribution.<\/p>"], "notes": []}, "EC.2": {"code": "EC.2", "dash": "15", "title": "Farm Financial Vibrancy & Resilience", "block": "eco", "page": "ind_15", "metrics": 22, "groups": [{"code": "Ec2.1", "name": "Financial performance", "planned": false, "metrics": [{"page": "ind_15", "code": "EC.2.1.1", "name": "Farm Income, Net Farm Income", "src": [["Net farm income", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100052-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210005201", "Table 32-10-0052-01", "2010–2025", ""]], "smooth": true, "about": {"unit": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "unit_short": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}, {"page": "m_15_1_2", "code": "EC.2.1.2", "name": "Farm Income, Farm receipts adjusted for government payments", "src": [["Farm cash receipts, annual", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100045-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210004501", "Table 32-10-0045-01", "2010–2025", ""]], "smooth": true, "about": {"unit": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "unit_short": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "calc": "Total farm cash receipts minus Tota
