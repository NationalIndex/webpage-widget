/A101-23-2021-eng.pdf", "", "", "2020-21", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of tested samples that met Canada's Maximum Residue Limits for pesticides, shown separately for domestic and imported fresh fruits and vegetables. Value taken as published in the CFIA National Chemical Residue Monitoring Program annual report (2020-21); no calculation by the Index.", "naics": ""}}, {"page": "m_8_3_2", "code": "FI.1.3.2", "name": "Compliance with veterinary drug Maximum Residue Limits", "src": [["2020/2021 Annual Report: National Chemical Residue Monitoring", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2023/acia-cfia/A101-23-2021-eng.pdf", "", "", "2020-21", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of tested samples that met Canada's Maximum Residue Limits for veterinary drugs, shown separately for domestic and imported meat. Value taken as published in the CFIA National Chemical Residue Monitoring Program annual report (2020-21); no calculation by the Index.", "naics": ""}}, {"page": "m_8_3_3", "code": "FI.1.3.3", "name": "Compliance rate for residues of other chemicals", "src": [["2020/2021 Annual Report: National Chemical Residue Monitoring", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2023/acia-cfia/A101-23-2021-eng.pdf", "", "", "2018-19, 2019-20, 2020-21, 2021-22", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of tested samples that met the limits for chemical residues other than pesticides and veterinary drugs. Values taken as published in the CFIA National Chemical Residue Monitoring Program annual reports (2018-19 to 2021-22); no calculation by the Index.", "naics": ""}}]}, {"code": "Fi1.4", "name": "Incidence of Foodborne Illnesses", "planned": false, "metrics": [{"page": "m_8_4_1a", "code": "FI.1.4.1a", "name": "National foodborne outbreak investigations coordinated by PHAC", "src": [["Foodborne and enteric illness outbreak investigations", "Public Health Agency of Canada", "https://health-infobase.canada.ca/enteric-illness/outbreaks/", "", "", "2008–2024", ""]], "smooth": true, "about": {"unit": "Number of investigations carried out.", "unit_short": "Number of investigations carried out.", "calc": "Download the Enteric Outbreak Summaries dataset and count national investigations by year.", "naics": ""}}, {"page": "m_8_4_1b", "code": "FI.1.4.1b", "name": "Outbreak investigations submitted to Outbreak Summaries", "src": [["Foodborne and enteric illness outbreak investigations", "Public Health Agency of Canada", "https://health-infobase.canada.ca/enteric-illness/outbreaks/", "", "", "2008–2024", ""]], "smooth": true, "about": {"unit": "Number of investigations carried out.", "unit_short": "Number of investigations carried out.", "calc": "Download the Enteric Outbreak Summaries dataset and count submitted investigations by year.", "naics": ""}}, {"page": "m_8_4_1c", "code": "FI.1.4.1c", "name": "Outbreak count by pathogen", "src": [["Foodborne and enteric illness outbreak investigations", "Public Health Agency of Canada", "https://health-infobase.canada.ca/enteric-illness/outbreaks/", "", "", "2008–2024", ""]], "smooth": true, "about": {"unit": "Number of outbreaks reported.", "unit_short": "Number of outbreaks reported.", "calc": "Extract the annual outbreak count for each pathogen from the Enteric Outbreak Summaries dataset.", "naics": ""}}, {"page": "m_8_4_1d", "code": "FI.1.4.1d", "name": "Total cases by pathogen", "src": [["Foodborne and enteric illness outbreak investigations", "Public Health Agency of Canada", "https://health-infobase.canada.ca/enteric-illness/outbreaks/", "", "", "2008–2024", ""]], "smooth": true, "about": {"unit": "Number of cases reported.", "unit_short": "Number of cases reported.", "calc": "Extract the annual total number of cases for each pathogen from the Enteric Outbreak Summaries dataset.", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#B96A45\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"15.5\" y=\"14\" width=\"17\" height=\"23\" rx=\"2.5\"/><rect x=\"20.5\" y=\"11.5\" width=\"7\" height=\"5\" rx=\"1.5\"/><path d=\"M19.5 26.5 L22.8 29.8 L28.8 22.8\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#B96A45\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"15.5\" y=\"14\" width=\"17\" height=\"23\" rx=\"2.5\"/><rect x=\"20.5\" y=\"11.5\" width=\"7\" height=\"5\" rx=\"1.5\"/><path d=\"M19.5 26.5 L22.8 29.8 L28.8 22.8\"/><\/g><\/svg>", "teaser": "The Safe Food Indicator assesses the performance of Canada’s food safety system, focusing on the outcomes of regulatory oversight, population health outcomes, compliance, and system…", "about": ["<p>The Safe Food Indicator assesses the performance of Canada’s food safety system, focusing on the outcomes of regulatory oversight, population health outcomes, compliance, and system response to food safety risks across the agri-food system.<\/p>", "<p>The indicator measures system-level food safety safeguards that underpin trust in Canadian food and support access to domestic and international markets. It assesses the overall safety of Canada’s food system through regulatory compliance, investigations, recalls, chemical-residue monitoring and foodborne illness. New metrics have been added to provide more accurate and comprehensive information on prevention, detection and response, while recognizing that no single measure can determine whether the food supply is becoming safer.<\/p>"], "observations": ["<p>Canada continues to record high regulatory compliance. The proportion of tested imported and domestic food products meeting federal requirements increased from 97.6% in 2022–23 to 98.6% in 2024–25 (<span class=\"ref\" title=\"Dashboard metric FI.1.1.1\">FI.1.1.1<\/span>). The percentage of federally registered food establishments that corrected identified issues following inspection also rose from 75.4% to 85.8%, reaching the Canadian Food Inspection Agency (CFIA) target of at least 85% (<span class=\"ref\" title=\"Dashboard metric FI.1.1.2\">FI.1.1.2<\/span>).<\/p>", "<p>Public confidence has also improved. The percentage of Canadians who agreed that the CFIA helps ensure food sold in Canada is safe increased from 71.5% in 2022–23 to 82% in 2024–25 <span class=\"ref\" title=\"Dashboard metric FI.1.1.4\">FI.1.1.4<\/span>). This new metric responds to an opportunity identified in 2025 by providing information on public perceptions of Canada’s food-safety oversight.<\/p>", "<p>Food-safety investigations increased from 2,529 in 2021–22 to 3,934 in 2025–26 (<span class=\"ref\" title=\"Dashboard metric FI.1.1.3\">FI.1.1.3<\/span>), while recalls rose from 196 in 2024 to 271 in 2025 (<span class=\"ref\" title=\"Dashboard metric FI.1.2.2\">FI.1.2.2<\/span>). These increases may reflect changes in food-safety risks, but they may also result from stronger surveillance, reporting, or regulatory activity. Even though Investigation and recall totals alone do not demonstrate that food became less safe.<\/p>", "<p>The proportion of higher-risk recalls initiated before an adverse effect was reported declined from 92.1% in 2023–24 to 71.9% in 2024–25 (<span class=\"ref\" title=\"Dashboard metric FI.1.2.1\">FI.1.2.1<\/span>). This decline warrants attention because the measure reflects the system’s ability to identify and remove higher-risk products before illnesses or injuries are reported.<\/p>", "<p>Pesticide Residue monitoring results continue to demonstrate strong performance, with available compliance rates generally above 93%. In 2020–21, pesticide-residue compliance was 99.2% for domestic fresh fruits and vegetables and 93.8% for imported products (<span class=\"ref\" title=\"Dashboard metric FI.1.3.1\">FI.1.3.1<\/span>).<\/p>", "<p>The addition of foodborne illness outbreak data to the Index provides further information on food safety outcomes. In 2024, the Public Health Agency of Canada (PHAC) coordinated investigations of 10 outbreaks involving 286 reported cases, compared with six outbreaks and 693 cases in 2023 (<span class=\"ref\" title=\"Dashboard metric FI.1.4\">FI.1.4<\/span>.1a). Salmonella accounted for four outbreaks (<span class=\"ref\" title=\"Dashboard metric FI.1.4\">FI.1.4<\/span>.1c) and 122 cases in 2024 (<span class=\"ref\" title=\"Dashboard metric FI.1.4\">FI.1.4<\/span>.1d). Although the number of outbreaks increased, associated cases declined by approximately 59%. Annual results can be influenced by a small number of large outbreaks and should be interpreted cautiously.<\/p>"], "limitations": ["<p>Assessing Canada’s food-safety performance remains challenging because relevant results are dispersed across several departmental reports, surveillance studies and recall databases that use different measures and coverage. Recall totals must also be interpreted carefully: one incident can generate numerous product recalls. Canada’s surveillance system depends on information shared among federal, provincial, territorial and regional authorities, which can affect the completeness and timeliness of national reporting. Additional limitations include inspection coverage gaps, uneven traceability across complex supply chains, risks associated with imported foods and food fraud, and limited publicly consolidated information connecting inspections, recalls, illnesses and corrective actions over time.<\/p>"], "opportunities": ["<p>Canada already has several initiatives supporting stronger food traceability. The <em>Safe Food for Canadians Act<\/em> Regulations require most food businesses to maintain one-step-back and one-step-forward records. The CFIA manages the national Livestock Traceability Program. It has also explored boat-to-plate traceability for seafood and completed a blockchain pilot to test how information can be shared across the supply chain<sup>1<\/sup>. Its current digital modernization agenda includes updated data and analytics strategies and improved digital-service platforms. Together, these initiatives provide a strong foundation and an opportunity to develop an interoperable, end-to-end digital traceability system that enables faster investigations, more targeted recalls and improved detection of food fraud.<\/p>"], "notes": ["CFIA completed a two-year initiative examining the practical application of blockchain for information sharing, supply-chain management and traceability. <a href=\"https://inspection.canada.ca/en/about-cfia/acts-and-regulations/forward-regulatory-plan/targeted-regulatory-review\" rel=\"noopener\" target=\"_blank\">https://inspection.canada.ca/en/about-cfia/acts-and-regulations/forward-regulatory-plan/targeted-regulatory-review<\/a>"]}, "FI.2": {"code": "FI.2", "dash": "9", "title": "Nutrition Information", "block": "fi", "page": "ind_9", "metrics": 8, "groups": [{"code": "Fi2.1", "name": "Provision of nutrition information", "planned": false, "metrics": [{"page": "ind_9", "code": "FI.2.1.1", "name": "Canada’s Food Guide publication and updates", "src": [["Canada’s Food Guide evidence review cycle", "Health Canada", "https://food-guide.canada.ca/en/evidence-review-cycle/summaries/2025/", "", "", "1982–2019 (4 years)", ""]], "smooth": false, "about": {"unit": "1 means the publication was released or updated in that year.", "unit_short": "1 means the publication was released or updated in that year.", "calc": "Record each publication or update year listed in the evidence review cycle.", "naics": ""}}, {"page": "m_9_1_2", "code": "FI.2.1.2", "name": "Scope of mandatory nutrition labelling", "src": [["Food and Drug Regulations", "Government of Canada", "https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/page-10.html#h-568846", "", "", "2025", ""]], "smooth": false, "about": {"unit": "Whether a regulatory requirement is in place (1 = yes).", "unit_short": "Whether a regulatory requirement is in place (1 = yes).", "calc": "Summarize the scope and exemptions established in the Food and Drug Regulations.", "naics": ""}}, {"page": "m_9_1_3", "code": "FI.2.1.3", "name": "Mandatory nutrition labelling requirements", "src": [["General requirements", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/general-requirements", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/general-requirements", "", "2026", ""], ["Information within the Nutrition Facts table", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/nutrition-facts-table", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/nutrition-facts-table", "", "2026", ""], ["List of ingredients and allergens on food labels", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/list-ingredients-and-allergens", "https://inspection.canada.ca/en/food-labels/labelling/industry/list-ingredients-and-allergens", "", "2026", ""], ["Industry resource: food allergen labelling", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/food-allergen-labelling", "https://inspection.canada.ca/en/food-labels/labelling/industry/food-allergen-labelling", "", "2026", ""], ["Front-of-package (FOP) nutrition symbol", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/fop-nutrition-symbol", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrition-labelling/fop-nutrition-symbol", "", "2026", ""]], "smooth": false, "about": {"unit": "1 means the element is required by regulation.", "unit_short": "1 means the element is required by regulation.", "calc": "Requirement confirmed from the CFIA page text; 1 = mandatory, no aggregation applied", "naics": ""}}, {"page": "m_9_1_4", "code": "FI.2.1.4", "name": "Permitted disease risk reduction claims", "src": [["Health claims on food labels", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/health-claims#c7", "", "", "2026", ""]], "smooth": false, "about": {"unit": "1 means the type of claim is permitted by regulation.", "unit_short": "1 means the type of claim is permitted by regulation.", "calc": "Each class is a category of disease risk reduction claim that Health Canada permits on food labels; 1 means the claim is permitted. Read from Health Canada's 'Health claims on food labels' page (2026).", "naics": ""}}, {"page": "m_9_1_5", "code": "FI.2.1.5", "name": "Permitted nutrient content statements and claims", "src": [["Table of Permitted Nutrient Content Statements and Claims", "Health Canada", "https://www.canada.ca/en/health-canada/services/technical-documents-labelling-requirements/table-permitted-nutrient-content-statements-claims/table-document.html", "", "", "2024", ""], ["Specific nutrient content claim requirements", "Health Canada", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrient-content/specific-requirements", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrient-content/specific-requirements", "Section 'Vitamin and mineral nutrient claims' (claim requirements)", "2024", ""]], "smooth": false, "about": {"unit": "1 means the category of claim is permitted by regulation.", "unit_short": "1 means the category of claim is permitted by regulation.", "calc": "Identify the categories listed in the official Table of Permitted Nutrient Content Statements and Claims.", "naics": ""}}, {"page": "m_9_1_6", "code": "FI.2.1.6", "name": "Use of Health Canada dietary guidance", "src": [["Departmental Results Report 2024–25", "Health Canada", "https://www.canada.ca/en/health-canada/corporate/transparency/corporate-management-reporting/departmental-performance-reports/2024-2025-departmental-results-report.html", "", "", "2022-23, 2023-24, 2024-25", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of Canadians who use dietary guidance provided by Health Canada, as reported by Health Canada in its Departmental Results Reports (2022-23 to 2024-25); value taken as published.", "naics": ""}}]}, {"code": "Fi2.2", "name": "Mandatory fortification", "planned": false, "metrics": [{"page": "m_9_2_1", "code": "FI.2.2.1", "name": "Mandatory food fortification", "src": [["Nutrient content claims: reference information", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrient-content/claims-reference-information", "https://inspection.canada.ca/en/food-labels/labelling/industry/nutrient-content/claims-reference-information", "Table: Foods to which vitamins, mineral nutrients and amino acids may or must be added (rows marked Mandatory)", "2025", ""]], "smooth": false, "about": {"unit": "1 means mandatory fortification applies to the food group.", "unit_short": "1 means mandatory fortification applies to the food group.", "calc": "Each class is a food group for which the Food and Drug Regulations make adding vitamins, mineral nutrients or amino acids mandatory (1 = a mandatory requirement exists). The nine groups bundle the rows marked 'Mandatory' in the CFIA table of foods to which vitamins, mineral nutrients and amino acids may or must be added; foods where addition is only voluntary are not counted.", "naics": ""}}]}, {"code": "Fi2.3", "name": "Misrepresentation", "planned": false, "metrics": [{"page": "m_9_3_1", "code": "FI.2.3.1", "name": "Prevalence of food misrepresented", "src": [["Food Fraud Annual Report 2022–23", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/about-cfia/science-and-research-cfia/our-research-and-publications/food-fraud-report-2023", "", "", "2022-23", ""]], "smooth": false, "about": {"unit": "Per cent of samples that met the test criteria (satisfactory results).", "unit_short": "Per cent of samples that met the test criteria (satisfactory results).", "calc": "Share of samples tested by the CFIA for authenticity, adulteration or substitution that were judged satisfactory, by food type (2022-23); value taken as published in the Food Fraud Annual Report.", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#B96A45\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 17.5 C20 13.5 13 15 13 23 C13 31 18 37.5 21.2 37.5 C22.6 37.5 23 36.6 24 36.6 C25 36.6 25.4 37.5 26.8 37.5 C30 37.5 35 31 35 23 C35 15 28 13.5 24 17.5 Z\"/><path d=\"M24 17.5 C24 14.5 25 12.5 27.5 11\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#B96A45\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 17.5 C20 13.5 13 15 13 23 C13 31 18 37.5 21.2 37.5 C22.6 37.5 23 36.6 24 36.6 C25 36.6 25.4 37.5 26.8 37.5 C30 37.5 35 31 35 23 C35 15 28 13.5 24 17.5 Z\"/><path d=\"M24 17.5 C24 14.5 25 12.5 27.5 11\"/><\/g><\/svg>", "teaser": "The Nutrition Information Indicator assesses Canada’s approach to providing transparent, standardized, and reliable nutrition information to consumers.", "about": ["<p>The Nutrition Information Indicator assesses Canada’s approach to providing transparent, standardized, and reliable nutrition information to consumers. It focuses on the availability, accessibility, and clarity of nutrition information provided through regulatory frameworks, disclosure requirements, labeling and public guidance and advice that support informed food choices and healthier diets at the population level.  The indicator captures key areas related to nutrition labelling, front-of-package labelling, nutrition information availability, and consumer transparency . It evaluates the extent to which consumers have access to consistent, valid and understandable nutrition information across the food system. <\/p>", "<p>While the indicator aligns strongly with the Food Integrity Block through its focus on transparency and consumer access to information, it does not directly measure nutrition or health outcomes, dietary behaviours, or the overall nutritional quality of diets. <\/p>", "<p>New metrics have been added to provide a more accurate and comprehensive assessment. The previous Indicator focused mainly on the existence of nutrition-labelling and fortification requirements. The expanded metrics include use of Health Canada’s dietary guidance, nutrient-content and disease-risk-reduction claims, implementation of front-of-package labelling, and food misrepresentation. These additions broaden the Indicator from documenting regulations to considering how nutrition information is communicated, used, and accurately represented.<\/p>"], "observations": ["<p>Canada’s Food Guide remains the foundation of national dietary guidance. It was last updated in 2019, replacing the 2007 version (<span class=\"ref\" title=\"Dashboard metric FI.2.1.1\">FI.2.1.1<\/span>). Health Canada’s 2025 evidence review<sup>1<\/sup> concluded that the current dietary guidance remains scientifically relevant, while identifying emerging evidence that may inform future updates.<\/p>", "<p>Nutrition information can be mandatory, including the Nutrition Facts table, ingredient list and allergen declarations (<span class=\"ref\" title=\"Dashboard metric FI.2.1.2\">FI.2.1.2<\/span>, <span class=\"ref\" title=\"Dashboard metric FI.2.1.3\">FI.2.1.3<\/span>), or voluntary, including nutrient-content claims such as “source of calcium” or “low in fat.” <span class=\"ref\" title=\"Dashboard metric FI.2.1.5\">FI.2.1.5<\/span>). Disease-risk-reduction claims may also be used when foods meet prescribed conditions. Permitted claims address relationships between diet and health outcomes such as hypertension, osteoporosis, heart disease, cancer, and dental caries (<span class=\"ref\" title=\"Dashboard metric FI.2.1.4\">FI.2.1.4<\/span>).<\/p>", "<p>The most significant regulatory change since the 2025 Index is the implementation of front-of-package nutrition labelling. As of January 1, 2026, most prepackaged foods that meet or exceed prescribed thresholds for saturated fat, sugars, or sodium must display a front-of-package “high in” symbol, subject to regulated exemptions (<span class=\"ref\" title=\"Dashboard metric FI.2.1.3\">FI.2.1.3<\/span>). Products imported, manufactured in Canada, or packaged at retail before that date may continue to be sold.<sup>2<\/sup> This requirement responds directly to an opportunity identified in the 2025 Update Index Report and provides consumers with more visible information about nutrients of public-health concern.<\/p>", "<p>The percentage of Canadians who reported using Health Canada’s dietary guidance was 44.3% from 2022–23 through 2024–25, below the federal target of at least 50% (<span class=\"ref\" title=\"Dashboard metric FI.2.1.6\">FI.2.1.6<\/span>). However, these results rely on Canadian Community Health Survey data last made available in 2021–22 and do not represent newly measured annual values.<sup>3<\/sup><\/p>", "<p>Canada also requires specified foods to be fortified with particular nutrients. Examples include iodine in table salt, vitamin D in milk and margarine, and B vitamins, iron, and folic acid in white flour (<span class=\"ref\" title=\"Dashboard metric FI.2.2.1\">FI.2.2.1<\/span>).<\/p>", "<p>The addition of food-misrepresentation data recognizes that nutrition information must be accurate and trustworthy. In targeted 2022–23 testing, satisfactory results ranged from 62% for samples of higher-priced oils other than olive oil, such as avocado, coconut and grapeseed oils and 68% for grated hard cheese to 90% for fruit juice and 98% for meat (<span class=\"ref\" title=\"Dashboard metric FI.2.3.1\">FI.2.3.1<\/span>).<\/p>"], "limitations": ["<p>Assessing nutrition information in Canada remains challenging because several measures track the existence of regulatory requirements rather than their implementation or effectiveness. Public data are limited on the number of products requiring front-of-package symbols, compliance rates, nutrient-content claims and changes in product formulation. The indicator also does not assess whether consumers understand nutrition information or whether it changes purchasing and dietary behaviour. Health Canada reported the same result of 44.3% for the use of its dietary guidance in each reporting year from 2022–23 through 2024–25, drawing on Canadian Community Health Survey data from 2021–22. Updated survey data are needed to track changes in the use of Health Canada’s dietary guidance over time.<\/p>"], "opportunities": ["<p>Canada’s implementation of front-of-package labelling and new supplemented-food requirements creates an important opportunity to improve both nutrition information and its measurement. These initiatives could support systematic monitoring of label compliance, consumer awareness and understanding, product reformulation and changes in consumer purchasing behaviour. Combined with Canada’s Food Guide, consumer-education resources and ongoing monitoring of food advertising to children they provide a foundation for assessing whether nutrition policies improve access to clear information and support healthier choices. Establishing a national baseline and publishing regular results would allow Canada to move beyond measuring the existence of requirements toward evaluating their implementation, reach and effectiveness.<\/p>"], "notes": ["<a href=\"https://www.canada.ca/en/health-canada/services/food-guide/educators-professionals/evidence-review-cycle/summaries/2025.html\" rel=\"noopener\" target=\"_blank\">https://www.canada.ca/en/health-canada/services/food-guide/educators-professionals/evidence-review-cycle/summaries/2025.html<\/a>", "Health Canada, <a href=\"https://www.canada.ca/en/health-canada/services/food-nutrition/legislation-guidelines/guidance-documents/front-package-nutrition-symbol-labelling-industry.html\" rel=\"noopener\" target=\"_blank\">Front-of-package nutrition symbol labelling guide<\/a>", "Health Canada, 2024–25 Departmental Results Report, Departmental Result 5: Canadians make healthy choices, Table 6, Footnote e. <a href=\"https://www.canada.ca/en/health-canada/corporate/transparency/corporate-management-reporting/departmental-performance-reports/2024-2025-departmental-results-report.html\" rel=\"noopener\" target=\"_blank\">Access the official report<\/a>"]}, "FI.3": {"code": "FI.3", "dash": "10", "title": "Antimicrobial Stewardship", "block": "fi", "page": "ind_10", "metrics": 3, "groups": [{"code": "Fi3.1", "name": "Antimicrobial Use", "planned": false, "metrics": [{"page": "ind_10", "code": "FI.3.1.1", "name": "Antimicrobials sold for animal use", "src": [["2024 Veterinary Antimicrobial Sales Highlights Report", "Health Canada", "https://www.canada.ca/en/health-canada/services/publications/drugs-health-products/2024-veterinary-antimicrobial-sales-highlights-report.html", "", "", "2020–2024", ""]], "smooth": true, "about": {"unit": "Thousand kilograms, i.e. tonnes of active ingredient or product, as reported.", "unit_short": "Thousand kilograms, i.e. tonnes of active ingredient or product, as reported.", "calc": "Total amount of antimicrobials sold for use in animals in Canada each year, in thousand kilograms of active ingredient, as reported in the 2024 Veterinary Antimicrobial Sales Highlights Report (Health Canada); value taken as published.", "naics": ""}}, {"page": "m_10_1_2", "code": "FI.3.1.2", "name": "Medically important antimicrobials sold by animal species", "src": [["Canadian Antimicrobial Resistance Surveillance System (CIPARS-VASR), Figure 4: medically important antimicrobials sold by species", "Public Health Agency of Canada", "https://health-infobase.canada.ca/src/data/cipars/vasr/CIPARS-VASR.zip", "https://health-infobase.canada.ca/cipars/antimicrobial-sales-use.html", "Figure 4", "2018–2024", ""]], "smooth": true, "about": {"unit": "Milligrams of antimicrobial used per kilogram of animal biomass (animal weight), which allows comparison between species of different sizes.", "unit_short": "Milligrams of antimicrobial used per kilogram of animal biomass (animal weight), which allows comparison between species of different sizes.", "calc": "Value taken from the 'mg per kg biomass' indicator of Figure 4 (quantity sold by species, Canada) in CIPARS-VASR; no aggregation applied", "naics": ""}}]}, {"code": "Fi3.2", "name": "Antimicrobial Resistance", "planned": false, "metrics": [{"page": "m_10_2_1", "code": "FI.3.2.1", "name": "Trend in antimicrobial resistance", "src": [["Canadian Antimicrobial Resistance Surveillance System (CARSS): 2024 Key findings (executive summary)", "Public Health Agency of Canada", "https://www.canada.ca/content/dam/phac-aspc/documents/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-2024-executive-summary/canadian-antimicrobial-resistance-surveillance-system-2024-executive-summary.pdf", "https://www.canada.ca/en/public-health/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-2024-executive-summary.html", "6", "2018-22, 2019-23", ""], ["Canadian Antimicrobial Resistance Surveillance System (CARSS): 2023 Key findings (executive summary)", "Public Health Agency of Canada", "https://www.canada.ca/content/dam/phac-aspc/documents/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-2023-executive-summary/canadian-antimicrobial-resistance-surveillance-system-2023-executive-summary.pdf", "https://www.canada.ca/en/public-health/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-2023-executive-summary.html", "5", "2017-21", ""], ["Canadian Antimicrobial Resistance Surveillance System (CARSS) Report 2022", "Public Health Agency of Canada", "https://www.canada.ca/content/dam/phac-aspc/documents/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-report-2022/canadian-antimicrobial-resistance-surveillance-system-report-2022.pdf", "https://www.canada.ca/en/public-health/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-report-2022.html", "9", "2016-20, 2016-19", ""], ["Canadian Antimicrobial Resistance Surveillance System Report 2021", "Public Health Agency of Canada", "https://www.canada.ca/content/dam/phac-aspc/documents/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-report-2021/canadian-antimicrobial-resistance-surveillance-system-report-2021.pdf", "https://www.canada.ca/en/public-health/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-report-2021.html", "17", "2015-19, 2014-18", ""]], "smooth": true, "about": {"unit": "Direction of change reported by the source (trending up, stable or trending down).", "unit_short": "Direction of change reported by the source (trending up, stable or trending down).", "calc": "Trend label read from the 'Key trends of antimicrobial resistance' summary (page 6) of the Canadian Antimicrobial Resistance Surveillance System (CARSS): 2024 Key findings (executive summary)", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#B96A45\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-45 24 24)\"><rect x=\"12\" y=\"18.5\" width=\"24\" height=\"11\" rx=\"5.5\"/><path d=\"M24 18.5 V29.5\"/><\/g><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#B96A45\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-45 24 24)\"><rect x=\"12\" y=\"18.5\" width=\"24\" height=\"11\" rx=\"5.5\"/><path d=\"M24 18.5 V29.5\"/><\/g><\/g><\/svg>", "teaser": "The Antimicrobial Stewardship indicator assesses Canada’s approach to promoting the responsible, prudent, and sustainable use of antimicrobials across the agri-food system.", "about": ["<p>The Antimicrobial Stewardship indicator assesses Canada’s approach to promoting the responsible, prudent, and sustainable use of antimicrobials across the agri-food system. It focuses on the policies, practices, monitoring systems, and stewardship measures implemented to reduce antimicrobial resistance risks while supporting animal health, food system integrity, and public health protection.<\/p>", "<p>In Canada, sales of antimicrobials for farmed and domestic animals are tracked through national surveillance systems, including the Veterinary Antimicrobial Sales Reporting system and the Canadian Antimicrobial Resistance Surveillance System (CARSS). CARSS also monitors antimicrobial use and resistance trends across human and animal health. Together, these datasets provide an evidence base for assessing stewardship progress and identifying risks to public health and the agri-food system from growing antimicrobial resistance.<\/p>", "<p>Updated species-specific sales and resistance metrics provide a more accurate and comprehensive assessment than total sales alone. They also strengthen alignment with the \"One Health” approach, which recognizes the connections among human, animal, plant, and environmental health<sup>1<\/sup>.<\/p>"], "observations": ["<p>Total veterinary antimicrobial sales declined from 1,064.3 tonnes in 2020 to 917.17 tonnes in 2024, a reduction of approximately 13.8%. Sales in 2024 were also 6.1% lower than the 976.8 metric tonnes reported in 2023 (<span class=\"ref\" title=\"Dashboard metric FI.3.1.1\">FI.3.1.1<\/span>). This sustained decline is a positive development, although sales volume alone cannot determine whether antimicrobials were used appropriately or explain the factors driving the change.<\/p>", "<p>Species-specific results present a mixed picture. Between 2023 and 2024, biomass-adjusted sales of medically important antimicrobials increased for pigs from 134 to 139.5 milligrams per kilogram of biomass. Sales declined for cattle from 66 to 56.5 mg/kg and for poultry from 68 to 48.1 mg/kg over the same period (<span class=\"ref\" title=\"Dashboard metric FI.3.1.2\">FI.3.1.2<\/span>). These decreases suggest continued progress in some production sectors.<\/p>", "<p>In contrast to the decline reported in the 2025 Index, aquaculture sales increased sharply from 58 mg/kg in 2023 to 221.9 mg/kg in 2024 (<span class=\"ref\" title=\"Dashboard metric FI.3.1.2\">FI.3.1.2<\/span>). This increase should be interpreted cautiously because changes in animal biomass, disease conditions, production cycles, and the timing or attribution of sales can produce substantial annual variation. Additional information is needed to determine whether the result represents a sustained change.<\/p>", "<p>Antimicrobial resistance remains a significant concern for the Canadian agri-food industry. Between 2018 and 2022, CARSS identified upward trends for several priority infections, including community-associated methicillin-resistant Staphylococcus aureus (MRSA) bloodstream infections, vancomycin-resistant Enterococcus, carbapenemase-producing Enterobacterales, and resistant Salmonella infections. Healthcare-associated MRSA bloodstream infections, Clostridioides difficile infections, and drug-resistant tuberculosis remained stable (<span class=\"ref\" title=\"Dashboard metric FI.3.2.1\">FI.3.2.1<\/span>).<sup>2<\/sup><\/p>", "<p>The addition of resistance trends strengthens the Indicator by recognizing that stewardship involves both responsible use and the preservation of treatment effectiveness. However, the reported resistance trends relate mainly to human infections and cannot be attributed directly to antimicrobial use in agriculture.<\/p>"], "limitations": ["<p>Current data are largely based on sales information, which provides a useful proxy but does not show how antimicrobials are administered on farms or whether they are used for treatment, disease prevention, or other purposes. Biomass adjustment improves comparison but does not fully account for production systems, disease pressure, animal lifespans, or treatment intensity.<\/p>", "<p>Coverage across the One Health spectrum remains uneven. The resistance component primarily describes human infections and is not directly linked to animal-use results. Reporting periods also differ, with sales data extending to 2024 and most resistance trends ending in 2022. Environmental surveillance and nationally representative farm-level data remain limited.<\/p>"], "opportunities": ["<p>Future reporting could integrate sales data with farm-level use, prescribing purposes, animal-health outcomes, and resistance findings from animals, food, people, and environmental sources. Results could also be presented by antimicrobial class, administration route, species, production stage, and region.<\/p>", "<p>Canada’s 2023–2027 Pan-Canadian Action Plan on Antimicrobial Resistance provides an opportunity to strengthen standardized One Health surveillance and integrate antimicrobial-use and resistance data across sectors.<sup>3<\/sup> Developing linked, longitudinal datasets would support clearer assessment of stewardship progress, improve international comparability, and reinforce the credibility of Canada’s antimicrobial stewardship efforts.<\/p>"], "notes": ["https://inspection.canada.ca/en/inspect-and-protect/science-and-innovation/cfia-leads-new-approach-one-health-risk", "Public Health Agency of Canada, <a href=\"https://www.canada.ca/en/public-health/services/publications/drugs-health-products/canadian-antimicrobial-resistance-surveillance-system-2024-executive-summary.html\" rel=\"noopener\" target=\"_blank\">CARSS: 2024 Key Findings<\/a>", "Public Health Agency of Canada, <a href=\"https://www.canada.ca/en/public-health/services/publications/drugs-health-products/pan-canadian-action-plan-antimicrobial-resistance-year-2-progress-report-2024-2025.html\" rel=\"noopener\" target=\"_blank\">Pan-Canadian Action Plan on Antimicrobial Resistance: Year 2 Progress Report<\/a>"]}, "FI.4": {"code": "FI.4", "dash": "11", "title": "Zoonotic Disease Mitigation", "block": "fi", "page": "ind_11", "metrics": 4, "groups": [{"code": "Fi4.1", "name": "Risk Surveillance", "planned": false, "metrics": [{"page": "ind_11", "code": "FI.4.1.1", "name": "Animal disease incursions into Canada", "src": [["The Canadian Food Inspection Agency's 2016 to 2017 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2017/acia-cfia/A101-12-2017-eng.pdf", "https://publications.gc.ca/site/eng/9.842230/publication.html", "29", "2014-15", ""], ["The Canadian Food Inspection Agency's 2017 to 2018 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2018/acia-cfia/A101-12-2018-eng.pdf", "https://publications.gc.ca/site/eng/9.842230/publication.html", "35", "2015-16", ""], ["The Canadian Food Inspection Agency's 2018 to 2019 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2020/acia-cfia/A101-12-2019-eng.pdf", "https://publications.gc.ca/site/eng/9.842230/publication.html", "13", "2016-17", ""], ["The Canadian Food Inspection Agency's 2019 to 2020 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2020/acia-cfia/A101-12-2020-eng.pdf", "https://publications.gc.ca/site/eng/9.842230/publication.html", "24", "2017-18", ""], ["The Canadian Food Inspection Agency's 2020 to 2021 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2022/acia-cfia/A101-12-2021-eng.pdf", "https://publications.gc.ca/site/eng/9.842230/publication.html", "32", "2018-19, 2019-20, 2020-21", ""], ["The Canadian Food Inspection Agency's 2023 to 2024 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2024/acia-cfia/A101-12-2024-eng.pdf", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/reports-parliament/departmental-results-report", "23", "2023-24", ""], ["The Canadian Food Inspection Agency's 2024 to 2025 Departmental Results Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2025/acia-cfia/A101-12-2025-eng.pdf", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/reports-parliament/2024-2025-drr", "25", "2024-25", ""]], "smooth": true, "about": {"unit": "Number of cases reported.", "unit_short": "Number of cases reported.", "calc": "Value read from the results table of the report; no aggregation applied", "naics": ""}}, {"page": "m_11_1_2", "code": "FI.4.1.2", "name": "Confirmed animal disease outbreaks", "src": [["Departmental Results Report 2024–25", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/reports-parliament/2024-2025-drr", "", "", "2022-23, 2023-24, 2024-25", ""]], "smooth": false, "about": {"unit": "Number of confirmed outbreaks for every 100 investigations carried out.", "unit_short": "Number of confirmed outbreaks for every 100 investigations carried out.", "calc": "Number of confirmed animal disease outbreaks per 100 investigations conducted by the CFIA in the fiscal year, as reported in the CFIA Departmental Results Report; value taken as published.", "naics": ""}}, {"page": "m_11_1_3", "code": "FI.4.1.3", "name": "Producer participation in animal health protection programs", "src": [["Departmental Plan 2026–27", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/reports-parliament/2026-2027-departmental-plan-0", "", "", "2022-23, 2023-24, 2024-25", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of Canadian producers that maintained or improved their status in programs designed to protect animal health, as reported in the CFIA Departmental Plan 2026-27 (2022-23 to 2024-25); value taken as published.", "naics": ""}}, {"page": "m_11_1_4", "code": "FI.4.1.4", "name": "National livestock traceability", "src": [["Canadian Food Inspection Agency", "https://inspection.canada.ca/en/animal-health/terrestrial-animals/traceability", "https://inspection.canada.ca/en/animal-health/terrestrial-animals/traceability", "", "", "2026", ""]], "smooth": false, "about": {"unit": "Whether a regulatory program is in force (1 = yes).", "unit_short": "Whether a regulatory program is in force (1 = yes).", "calc": "Each class is a livestock species covered by Canada's compulsory national traceability program; 1 means the program is in force (2026).", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#B96A45\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 36.5 C24 36.5 12 28.5 12 20.5 A6.2 6.2 0 0 1 24 17.5 A6.2 6.2 0 0 1 36 20.5 C36 28.5 24 36.5 24 36.5 Z\"/><path d=\"M24 21.5 V29.5 M20 25.5 H28\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#B96A45\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 36.5 C24 36.5 12 28.5 12 20.5 A6.2 6.2 0 0 1 24 17.5 A6.2 6.2 0 0 1 36 20.5 C36 28.5 24 36.5 24 36.5 Z\"/><path d=\"M24 21.5 V29.5 M20 25.5 H28\"/><\/g><\/svg>", "teaser": "The Zoonotic Disease Mitigation Indicator assesses Canada’s capacity to prevent, monitor, manage, and mitigate zoonotic disease risks across the agri-food system.", "about": ["<p>The Zoonotic Disease Mitigation Indicator assesses Canada’s capacity to prevent, monitor, manage, and mitigate zoonotic disease risks across the agri-food system. It focuses on the systems, frameworks, and practices implemented to reduce the transmission of diseases between animals, humans, and the environment, while supporting food system integrity, public health protection, and animal health management.<\/p>", "<p>The Indicator focuses on Risk Surveillance, including the prevention of animal-disease incursions, confirmed outbreaks detected through CFIA investigations and producer participation in animal-health protection programs. New metrics have been added to provide more accurate and comprehensive information. They broaden the Indicator beyond border biosecurity by considering disease occurrence within Canada and producer participation in preventive programs. Together, these measures provide a stronger basis for assessing preparedness and response.<\/p>"], "observations": ["<p>According to CFIA’s 2023–24 Departmental Results Report, no cases of animal diseases posing a risk to animal or human health were identified as having entered Canada (<span class=\"ref\" title=\"Dashboard metric FI.4.1.1\">FI.4.1.1<\/span>). This maintains the result reported in 2020–21 and reflects regulatory controls, import requirements and surveillance for high-risk animals and animal products. However, the result does not mean that Canada experienced no animal or zoonotic diseases during the reporting period.<\/p>", "<p>The addition of a domestic outbreak measure provides important context. The rate of confirmed animal-disease outbreaks declined slightly from 28 per 100 CFIA investigations in 2022–23 to 27 in 2023–24, before increasing to 37.5 in 2024–25. This result was substantially above CFIA’s target of no more than three outbreaks per 100 investigations (<span class=\"ref\" title=\"Dashboard metric FI.4.1.2\">FI.4.1.2<\/span>). CFIA attributed the result to ongoing highly pathogenic avian influenza infections transmitted from wild birds to domestic poultry¹. The increase therefore reflects a significant continuing disease event rather than a general deterioration across all animal diseases.<\/p>", "<p>Producer participation provides another perspective on prevention. The percentage of participating producers who maintained or improved their status in animal-health protection programs increased from 94% in 2022–23 to 97% in 2023–24, before declining to 86% in 2024–25 (<span class=\"ref\" title=\"Dashboard metric FI.4.1.3\">FI.4.1.3<\/span>). CFIA reported that the decline was associated with fewer herds enrolled in voluntary programs addressing chronic wasting disease, scrapie and enzootic bovine leukosis.<\/p>", "<p>Canada also has a compulsory national livestock traceability program covering cattle, bison, sheep, pigs and farmed wild boars (<span class=\"ref\" title=\"Dashboard metric FI.4.1.4\">FI.4.1.4<\/span>). Managed by CFIA under the Health of Animals Act and regulations, the system uses animal identification and movement information to support disease investigations, control measures and emergency response. Its existence strengthens Canada’s capacity to identify potentially affected animals and premises and to respond more rapidly when an outbreak occurs.<\/p>", "<p>Together, these metrics demonstrate that preventing disease entry is only one component of zoonotic disease mitigation. Domestic surveillance, outbreak control, producer participation and effective livestock traceability are also essential to protecting animal and human health.<\/p>"], "limitations": ["<p>The Indicator continues to provide a high-level picture and does not identify diseases, species, regions, investigation numbers or affected animals. The zero-entry measure is binary and does not capture intercepted shipments, near misses or threats mitigated before entry.<\/p>", "<p>The outbreak rate includes animal diseases that may not be zoonotic and therefore cannot be interpreted as a direct measure of human-health risk. It is also influenced by surveillance intensity and specific events such as highly pathogenic avian influenza. The producer measure covers participants in six voluntary terrestrial animal-health programs and does not represent all Canadian producers. Changes may reflect enrolment rather than changes in on-farm biosecurity. Similarly, the traceability metric confirms that a national system exists but does not measure its coverage, data completeness, reporting timeliness, compliance or effectiveness during an outbreak. It does not cover all livestock species, and traceability requirements and delivery systems may vary by species and jurisdiction. Proposed amendments to strengthen livestock traceability requirements had not been finalized as of June 2026<sup>1<\/sup>.<\/p>", "<p>The Indicator does not directly measure human zoonotic infections, wildlife reservoirs, occupational exposure or transmission among animals, people and the environment.<\/p>"], "opportunities": ["<p>Future reporting could present results by disease, species, region and zoonotic potential, while including surveillance coverage, investigations, affected premises and response times. Reporting interceptions and emerging international threats would provide a more complete assessment of border preparedness.<\/p>", "<p>Producer measures could include program enrolment, vaccination, biosecurity-plan adoption and compliance outcomes. Linking CFIA animal-health data with human-health, wildlife and environmental surveillance would strengthen the One Health approach. Greater alignment with World Organization for Animal Health (WOAH), World Health Organization (WHO) and FAO early-warning systems would improve comparability, preparedness and transparency.<\/p>"], "notes": ["In June 2026, CFIA announced a revised regulatory approach that would advance updated traceability requirements for goats, sheep, cervids and pigs, while pausing proposed new movement-reporting requirements for cattle and bison. Final stakeholder engagement and publication in the Canada Gazette, Part II were still pending."]}, "FI.5": {"code": "FI.5", "dash": "12", "title": "Traceability Implementation", "block": "fi", "page": "ind_12", "metrics": 2, "groups": [{"code": "Fi5.1", "name": "Traceability scope", "planned": false, "metrics": [{"page": "ind_12", "code": "FI.5.1.1", "name": "Sector coverage of traceability requirements", "src": [["Regulatory requirements: Traceability", "Canadian Food Inspection Agency", "https://inspection.canada.ca/en/food-safety-industry/traceability/traceability", "", "", "2023", ""]], "smooth": false, "about": {"unit": "Number of food-chain functions covered by the requirement (for example importing, exporting, producing).", "unit_short": "Number of food-chain functions covered by the requirement (for example importing, exporting, producing).", "calc": "Each class is a function of the food chain (importing, exporting, producing, manufacturing, distributing, storing, selling) to which the traceability requirements of the Safe Food for Canadians Regulations apply; 1 means covered (2023).", "naics": ""}}, {"page": "m_12_1_2", "code": "FI.5.1.2", "name": "CFIA-licensed establishments requiring traceability", "src": [["Safe Food for Canadians Licence Registry", "Canadian Food Inspection Agency", "https://apps.inspection.canada.ca/webapps/foodlicenceregistry/en/", "", "", "2025", ""], ["Safe Food for Canadians Licence Registry", "Canadian Food Inspection Agency", "https://apps.inspection.canada.ca/webapps/foodlicenceregistry/FoodLicenceRegistry/DownloadFoodLicenceList/?language=e&downloadType=csv", "https://apps.inspection.canada.ca/webapps/foodlicenceregistry/en/", "", "2026", ""]], "smooth": false, "about": {"unit": "Number of food businesses holding a Safe Food for Canadians licence.", "unit_short": "Number of food businesses holding a Safe Food for Canadians licence.", "calc": "Use the number of licensed establishments in the Safe Food for Canadians Licence Registry.", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#B96A45\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13.5 14 V32 M18.5 14 V32 M22 14 V32 M27 14 V32 M30.5 14 V32 M34.5 14 V32\"/><path d=\"M14 36.5 H34\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#B96A45\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13.5 14 V32 M18.5 14 V32 M22 14 V32 M27 14 V32 M30.5 14 V32 M34.5 14 V32\"/><path d=\"M14 36.5 H34\"/><\/g><\/svg>", "teaser": "Traceability in the food system ensures that products can be tracked one step forward and one step back across the supply chain.", "about": ["<p>Traceability in the food system ensures that products can be tracked one step forward and one step back across the supply chain. It enables rapid responses to food-safety incidents, supports targeted recalls, protects public health and safety, and contributes to transparency and consumer confidence.<\/p>", "<p>The Indicator includes two metrics: Sector Coverage of Traceability Requirements, which outlines the food-system activities covered by Canadian regulations; and Number of Valid Safe Food for Canadians Licence Holders, which provides an indication of the scale of federally regulated food businesses. Both metrics relate to the Safe Food for Canadians Regulations, administered by the Canadian Food Inspection Agency for food imported, exported, or traded interprovincially.<\/p>", "<p>The licence-holder metric adds important quantitative information to the Indicator. The first metric described only the existence and scope of traceability requirements. Thismetric helps show how many federally licensed businesses operate within the regulatory system, although it does not directly measure compliance or traceability performance.<\/p>"], "observations": ["<p>Under the Safe Food for Canadians Regulations, covered food businesses are generally required to maintain records that allow food to be traced forward to the immediate customer and back to the immediate supplier. Requirements apply to a broad range of activities, including importing, exporting, manufacturing, processing, treating, preserving, grading, packaging, labelling, and storing food for interprovincial or international trade (<span class=\"ref\" title=\"Dashboard metric FI.5.1.1\">FI.5.1.1<\/span>).¹<\/p>", "<p>Retail businesses—including supermarkets, farmers’ markets, grocery stores, bakeries, and butcher shops—must generally trace food back to their immediate supplier but are not required to identify individual consumers. Restaurants and similar enterprises are excluded from these retail traceability provisions <span class=\"ref\" title=\"Dashboard metric FI.5.1.1\">FI.5.1.1<\/span>).<\/p>", "<p>Traceability documents must identify the food, usually through its common name and a lot code or other unique identifier. They must also record relevant transaction dates and the names and addresses of immediate suppliers and customers, as applicable. Businesses must be able to provide required traceability documents to CFIA within 24 hours of a request, or within a shorter period when CFIA considers the information necessary to address a risk of injury to human health.<sup>1<\/sup><\/p>", "<p>As of April 10, 2025, the Safe Food for Canadians Licence Registry listed 21,026 valid licence holders (<span class=\"ref\" title=\"Dashboard metric FI.5.1.2\">FI.5.1.2<\/span>). This result demonstrates the broad regulatory reach of the federal licensing framework and provides an initial quantitative measure of the number of businesses operating within it.<\/p>", "<p>However, the number of valid licence holders may change as licences are issued, renewed, amended, suspended, or cancelled. A licence may also cover multiple activities or establishments. The result should therefore not be interpreted as the number of distinct physical facilities or as evidence that all licence holders fully comply with traceability requirements.<\/p>"], "limitations": ["<p>The current metrics assess regulatory scope rather than implementation effectiveness. They do not show whether licence holders maintain complete and accurate records, how quickly products can be traced, or whether systems are interoperable across businesses and jurisdictions.<\/p>", "<p>The licence registry does not represent every food business in Canada. Businesses operating solely within a province may be governed primarily by provincial requirements, while restaurants and certain direct-to-consumer activities are excluded from particular federal provisions. Small businesses may also experience greater financial, technical, and administrative barriers to adopting digital traceability systems.<\/p>", "<p>There is no consistent national measure of traceability compliance, record completeness, recall response time, or the proportion of food that can be traced electronically from its origin through the supply chain. The number of licence holders therefore provides information on regulatory reach but not the quality, speed, or effectiveness of traceability implementation.<\/p>"], "opportunities": ["<p>Future reporting could measure compliance with record-keeping requirements, record completeness, response times, and the proportion of affected products successfully identified and removed during recalls. Results could be reported by commodity, activity, business size, and domestic or imported origin.<\/p>", "<p>A national digital traceability framework could improve interoperability and information exchange while supporting small and medium-sized businesses with technology adoption. International developments also provide an opportunity for alignment. The United States’ Food Safety Modernization Act (FSMA) 204 rule will require additional electronic traceability records for specified higher-risk foods, with enforcement not expected before July 20, 2028.<sup>2<\/sup> Preparing Canadian exporters for these requirements could protect market access while strengthening domestic traceability capacity.<\/p>", "<h1 id=\"economic\">ECONOMIC<\/h1>"], "notes": ["Canadian Food Inspection Agency, <a href=\"https://inspection.canada.ca/en/food-safety-industry/traceability/traceability\" rel=\"noopener\" target=\"_blank\">Regulatory requirements: Traceability for food<\/a>", "U.S. Food and Drug Administration, <a href=\"https://www.fda.gov/food/food-safety-modernization-act-fsma/fsma-final-rule-requirements-additional-traceability-records-certain-foods\" rel=\"noopener\" target=\"_blank\">Food Traceability Final Rule<\/a>"]}, "SW.1": {"code": "SW.1", "dash": "18", "title": "Decent Work for People", "block": "swb", "page": "ind_18", "metrics": 25, "groups": [{"code": "Sw1.1", "name": "Workplace safety and mental health", "planned": false, "metrics": [{"page": "ind_18", "code": "SW.1.1.1a", "name": "Stress rating of farmers, Perceived stress", "src": [["Stress, anxiety, depression, and resilience in Canadian farmers", "Jones-Bitton A, Best C, MacTavish J, Fleming S, Hoy S", "https://doi.org/10.1007/s00127-019-01738-2", "https://pubmed.ncbi.nlm.nih.gov/31197397/", "Section 'Perceived stress' (Results)", "2015-2016", ""], ["Mental Health and Substance Use of Farmers in Canada during COVID-19", "Thompson R, Hagen BNM, Lumley MN, Winder CB, Gohar B, Jones-Bitton A", "https://doi.org/10.3390/ijerph192013566", "https://pubmed.ncbi.nlm.nih.gov/36294146/", "Table 3 (Total); section 3.2.3", "2021", ""]], "smooth": false, "about": {"unit": "Mean score on the survey scale used (higher means more of what the scale measures; see the calculation).", "unit_short": "Mean score on the survey scale used (higher means more of what the scale measures; see the calculation).", "calc": "Mean score on the 10-item Perceived Stress Scale (PSS), range 0-40; higher = greater perceived stress. Value as reported in the paper (survey estimate for all responding farmers); no aggregation applied", "naics": ""}}, {"page": "m_18_1_1b", "code": "SW.1.1.1b", "name": "Stress rating of farmers, Anxiety symptoms", "src": [["Stress, anxiety, depression, and resilience in Canadian farmers", "Jones-Bitton A, Best C, MacTavish J, Fleming S, Hoy S", "https://doi.org/10.1007/s00127-019-01738-2", "https://pubmed.ncbi.nlm.nih.gov/31197397/", "Table 2 (HADS-A, Total)", "2015-2016", ""], ["Mental Health and Substance Use of Farmers in Canada during COVID-19", "Thompson R, Hagen BNM, Lumley MN, Winder CB, Gohar B, Jone re on the survey scale used (higher means more of what the scale measures; see the calculation).", "unit_short": "Mean score on the survey scale used (higher means more of what the scale measures; see the calculation).", "calc": "Mean score on the emotional-exhaustion subscale of the Maslach Burnout Inventory-General Survey; higher scores indicate greater emotional exhaustion. Value as reported in the paper (survey estimate for all responding farmers); no aggregation applied", "naics": ""}}, {"page": "m_18_1_1e", "code": "SW.1.1.1e", "name": "Help seeking behaviour", "src": [["Mental Health and Substance Use of Farmers in Canada during COVID-19", "Thompson R, Hagen BNM, Lumley MN, Winder CB, Gohar B, Jones-Bitton A", "https://doi.org/10.3390/ijerph192013566", "https://pubmed.ncbi.nlm.nih.gov/36294146/", "Section 3.7", "2021", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of farmers who accessed internet, telephone or in-person resources to manage emotions, mental health, or alcohol or drug use during the COVID-19 pandemic. Value as reported in the paper (survey estimate for all responding farmers); no aggregation applied", "naics": ""}}, {"page": "m_18_1_3", "code": "SW.1.1.3", "name": "Farm workplace fatalities.", "src": [["Canadian Agricultural Safety Association", "https://www.casa-acsa.ca/wp-content/uploads/CAIR_Ag_Fatalities_1990-2020_en_V6.pdf", "https://www.casa-acsa.ca/wp-content/uploads/CAIR_Ag_Fatalities_1990-2020_en_V6.pdf", "", "", "2014–2020", ""], ["Canadian Agricultural Safety Association", "https://www.casa-acsa.ca/wp-content/uploads/CAIR_Ag_Fatalities_1990-2020_en_V6.pdf", "https://www150.statcan.gc.ca/n1/pub/96-325-x/2021001/article/00013-eng.htm", "", "", "2010–2013", ""]], "smooth": true, "about": {"unit": "A number as reported by the source; the unit is given in the metric name or description.", "unit_short": "A number as reported by the sou  "", "", "2026", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Share of employees who are union members in each industry group (Statistics Canada Table 14-10-0132-01, 2026); value taken as published.", "naics": "Agriculture; Manufacturing (NAICS 31-33); Accommodation and food services (NAICS 72)."}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#7AA3B5\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"17.5\" r=\"5.2\"/><path d=\"M14 37 C14 29.5 18 25.5 24 25.5 C30 25.5 34 29.5 34 37\"/><path d=\"M18.8 15.5 C19.5 12 21.5 10.5 24 10.5 C26.5 10.5 28.5 12 29.2 15.5 Z\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#7AA3B5\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"17.5\" r=\"5.2\"/><path d=\"M14 37 C14 29.5 18 25.5 24 25.5 C30 25.5 34 29.5 34 37\"/><path d=\"M18.8 15.5 C19.5 12 21.5 10.5 24 10.5 C26.5 10.5 28.5 12 29.2 15.5 Z\"/><\/g><\/svg>", "teaser": "Decent Work for People refers to the extent to which Canada’s agri-food sector provides opportunities for all individuals to obtain productive work in conditions of freedom, equity,…", "about": ["<p>Decent Work for People refers to the extent to which Canada’s agri-food sector provides opportunities for all individuals to obtain productive work in conditions of freedom, equity, security and human dignity, without discrimination while contributing to the social sustainability of the agri-food system.<\/p>", "<p>The indicator also examines how labour conditions contribute to the long-term social sustainability, resilience, and attractiveness of the agri-food sector.<\/p>", "<p>New metrics have been added to provide more accurate and comprehensive information and to better align the Indicator with the International Labour Organization’s (ILO) Decent Work Agenda. Together, these metrics assess whether the sector offers stable, equitable, and rewarding work environments for current and future generations.<\/p>"], "observations": ["<p>Mental health remains a concern for farmers. The average perceived-stress score was 18.7 out of 40 in 2021, close to 18.9 in 2015–16 (<span class=\"ref\" title=\"Dashboard metric SW.1.1\">SW.1.1<\/span>.1a).<sup>1<\/sup> In the 2021 survey, 26.8% of farmers screened positive for anxiety (<span class=\"ref\" title=\"Dashboard metric SW.1.1\">SW.1.1<\/span>.1b) and 23.6% screened positive for major depressive disorder (<span class=\"ref\" title=\"Dashboard metric SW.1.1\">SW.1.1<\/span>.1c). These are screening results, not clinical diagnoses. During the COVID-19 pandemic, 20.9% reported using resources to manage emotional, mental-health or substance-use concerns (<span class=\"ref\" title=\"Dashboard metric SW.1.1\">SW.1.1<\/span>.1e). Farm-related fatalities numbered 48 in 2020, compared with 91 in 2010, although annual totals fluctuated (<span class=\"ref\" title=\"Dashboard metric SW.1.1.3\">SW.1.1.3<\/span>).<sup>2<\/sup><\/p>", "<p>Measures of inclusion show persistent gaps. Women made up 46.2% of the agri-food workforce in 2025 (<span class=\"ref\" title=\"Dashboard metric SW.1.2.4\">SW.1.2.4<\/span>) and 30.4% of farm operators in 2021 (<span class=\"ref\" title=\"Dashboard metric SW.1.2.2\">SW.1.2.2<\/span>), but held 15% of seats on the sector association boards reviewed in 2025.<sup>3<\/sup> In 2025, women’s average hourly wages were 88% of men’s (<span class=\"ref\" title=\"Dashboard metric SW.1.2\">SW.1.2<\/span>.6a), and their average weekly wages were 79.4% of men’s (<span class=\"ref\" title=\"Dashboard metric SW.1.2\">SW.1.2<\/span>.6b).<sup>4<\/sup> Indigenous employment in the broader agriculture, natural resources and utilities category rose from 43,300 in 2023 to 45,100 in 2025 (<span class=\"ref\" title=\"Dashboard metric SW.1.2.5\">SW.1.2.5<\/span>).<sup>5<\/sup> 1,355 employers were publicly listed as non-compliant under the Temporary Foreign Worker Program or International Mobility Program from June 2016 to July 2026 <span class=\"ref\" title=\"Dashboard metric SW.1.2.1\">SW.1.2.1<\/span>).<sup>6<\/sup> Because this is a cumulative count, it should not be interpreted as an annual non-compliance rate.<\/p>", "<p>Measures of workforce renewal point in different directions. Enrolment in agriculture, veterinary and agriculture operations and related science and postsecondary fields rose from 11,445 in 2016/17 to 19,833 in 2023/24 (<span class=\"ref\" title=\"Dashboard metric SW.1.3.3\">SW.1.3.3<\/span>), and 4-H Canada reported 19,694 members in 2025–26 (<span class=\"ref\" title=\"Dashboard metric SW.1.3\">SW.1.3<\/span>.2a).<sup>7<\/sup> Meanwhile, the share of agri-food workers aged 15–24 fell from 27.8% in 2023 to 25.1% in 2025 (<span class=\"ref\" title=\"Dashboard metric SW.1.2.7\">SW.1.2.7<\/span>).<sup>3<\/sup> Workers aged 55 and over accounted for 19.2% of the workforce in 2025, down from 20.2% in 2023 (<span class=\"ref\" title=\"Dashboard metric SW.1.3.7\">SW.1.3.7<\/span>).<sup>3<\/sup> These measures show participation in education and youth programs alongside workforce trends; they do not establish how many participants subsequently enter agri-food employment.<\/p>", "<p>New measures add detail on job opportunities and worker representation. In 2024, job vacancy rates ranged from 2.5% in food manufacturing to 4.9% in food services (<span class=\"ref\" title=\"Dashboard metric SW.1.3.6\">SW.1.3.6<\/span>).<sup>8<\/sup> Average weekly earnings in food manufacturing reached $1,249.75 in 2025, up from $1,097.74 in 2020 (<span class=\"ref\" title=\"Dashboard metric SW.1.3.4\">SW.1.3.4<\/span>).<sup>9<\/sup> Unionization rates reached 3% in agriculture, 21.6% in manufacturing and 5.9% in accommodation and food services (<span class=\"ref\" title=\"Dashboard metric SW.1.3.9\">SW.1.3.9<\/span>). These industry figures provide useful context, but their categories do not all match the combined agri-food workforce used in the other measures.<\/p>"], "limitations": ["<p>The main challenge is that the available measures do not form a consistent picture of decent work over time or across the whole agri-food system. Several come from occasional or one-off surveys. Even where earlier results exist, comparisons can be difficult: the farmer mental-health studies, for example, used different screening tools. Industry coverage also varies. Some datasets group agriculture with natural resources and utilities, while others report on manufacturing or services more broadly, making it difficult to isolate food processing, retail and food service.<\/p>", "<p>These gaps also limit how closely the indicator can reflect the ILO Decent Work Agenda. The new unionization measure offers a starting point for understanding worker representation, but it does not show the full extent of collective bargaining coverage or how labour rights are exercised in practice. Employment security, working hours, social protection, protection against forced labour and access to workplace complaint mechanisms likewise cannot yet be assessed consistently across the sector.<\/p>"], "opportunities": ["<p>Recent initiatives connect directly to the Decent Work for People metrics. Federal funding for farm safety could support progress on workplace fatalities and farmer mental health, while the Youth Employment and Skills Program offers paid experience at a time when the share of young agri-food workers is declining.<sup>10<\/sup> Annual Temporary Foreign Worker Program inspection results could also add context to the Index’s cumulative count of non-compliant employers.<sup>11<\/sup><\/p>", "<p>The Centre’s work to align this indicator with the ILO Decent Work Agenda is an opportunity to identify gaps in the current metrics and develop a more complete picture of employment conditions, worker protections and social dialogue across the agri-food system..<\/p>"], "notes": ["Thompson R, Hagen BNM, Lumley MN, Winder CB, Gohar B, Jones-Bitton A, <a href=\"https://pubmed.ncbi.nlm.nih.gov/36294146/\" rel=\"noopener\" target=\"_blank\">Mental Health and Substance Use of Farmers in Canada during COVID-19<\/a>, 2022; Jones-Bitton A, Best C, MacTavish J, Fleming S, Hoy S, <a href=\"https://pubmed.ncbi.nlm.nih.gov/31197397/\" rel=\"noopener\" target=\"_blank\">Stress, anxiety, depression, and resilience in Canadian farmers<\/a>, 2020.", "<a href=\"https://www.casa-acsa.ca/wp-content/uploads/CAIR_Ag_Fatalities_1990-2020_en_V6.pdf\" rel=\"noopener\" target=\"_blank\">Canadian Agricultural Safety Association<\/a>, 2023.", "Statistics Canada, <a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410002301\" rel=\"noopener\" target=\"_blank\">Labour force characteristics by industry, annual (Table 14-10-0023-01)<\/a>, 2026. <a href=\"https://www150.statcan.gc.ca/n1/pub/96-325-x/2021001/article/00013-eng.htm\" rel=\"noopener\" target=\"_blank\">statcan.gc.ca<\/a>, 2021.", "<a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410032002\" rel=\"noopener\" target=\"_blank\">Average usual hours and wages by selected characteristics, monthly, unadjusted for seasonality, Table: 14-10-0320-02<\/a>, 2025.", "Employment by geography, Indigenous group and industry, 2025.", "Immigration, Refugees and Citizenship Canada, <a href=\"https://www.canada.ca/en/immigration-refugees-citizenship/services/work-canada/employers-non-compliant.html\" rel=\"noopener\" target=\"_blank\">Employers who have been found non-compliant<\/a>, 2026.", "<a href=\"https://4-h-canada.ca/annual-report/2025-2026.html\" rel=\"noopener\" target=\"_blank\">4-H Canada<\/a>, 2026; <a href=\"https://4-h-canada.ca/annual-report/2023-2024.html\" rel=\"noopener\" target=\"_blank\">4-H Canada<\/a>, 2026.", "<a href=\"https://agriculture.canada.ca/en/sector/data-reports/state-labour-agriculture-and-agri-food\" rel=\"noopener\" target=\"_blank\">Job vacancy rate trends (2015-2024)<\/a>, 2024.", "<a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410020401\" rel=\"noopener\" target=\"_blank\">Average weekly earnings by industry, annual, Statistics Canada Table: 14-10-0204-01<\/a>.", "Agriculture and Agri-Food Canada, <a href=\"https://www.canada.ca/en/agriculture-agri-food/news/2026/09/government-of-canada-invests-in-safety-on-canadian-farms.html\" rel=\"noopener\" target=\"_blank\">farm safety investment,<\/a> September 20, 2026/ <a href=\"https://www.canada.ca/en/agriculture-agri-food/news/2026/03/government-of-canada-invests-in-youth-employment-in-canadian-agriculture.html\" rel=\"noopener\" target=\"_blank\">youth employment investment<\/a>, March 5, 2026", "Employment and Social Development Canada, <a href=\"https://www.canada.ca/en/employment-social-development/news/2026/07/the-government-of-canada-highlights-doubling-of-compliance-monetary-penalties-under-the-temporary-foreign-worker-program.html\" rel=\"noopener\" target=\"_blank\">Temporary Foreign Worker Program inspection results<\/a>, July 9, 2026"]}, "SW.2": {"code": "SW.2", "dash": "19", "title": "Food Security", "block": "swb", "page": "ind_19", "metrics": 12, "groups": [{"code": "Sw2.1", "name": "Food insecurity", "planned": false, "metrics": [{"page": "ind_19", "code": "SW.2.1.1", "name": "Calculated consumer price index for food purchased from stores and restaurants, weighted by types of purchases.", "src": [["Consumer Price Index, annual average, not seasonally adjusted", "", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810000501", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810000501", "Table 18-10-0005-01, Food, Canada, annual average (2002=100)", "2020–2025", ""]], "smooth": tru
