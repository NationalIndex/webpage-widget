ank.org/data360-data/data/FAO_CAHD/FAO_CAHD_7004.csv", "https://data360.worldbank.org/en/indicator/FAO_CAHD_7004", "", "2017–2025", ""]], "smooth": true, "about": {"unit": "Canadian dollars per person per day: the cost of a healthy diet for one person for one day.", "unit_short": "Canadian dollars per person per day: the cost of a healthy diet for one person for one day.", "calc": "Value taken directly from the source series (UNIT_MEASURE XDC_PS_D, domestic currency per person per day); no aggregation applied. The cost of a healthy diet indicator is the cost of purchasing the least expensive locally available foods to meet requirements for energy and food-based dietary guidelines (FBDG) for a representative person within energy balance at 2 330 kcal/day. The cost is measured in local currency unit (LCU), and also converted to international dollars using purchasing power parity (PPP).", "naics": ""}}]}, {"code": "Sw2.2", "name": "Increasing access", "planned": false, "metrics": [{"page": "m_19_2_1", "code": "SW.2.2.1", "name": "Expenditures on the Nutrition North Program.", "src": [["Government of Canada", "https://www.nutritionnorthcanada.gc.ca/eng/1415538638170/1415538670874", "https://www.nutritionnorthcanada.gc.ca/eng/1415538638170/1415538670874", "", "", "2024-2025, 2023-2024, 2022-2023, 2021-2022, 2025-2026", ""]], "smooth": true, "about": {"unit": "A number as reported by the source; the unit is given in the metric name or description.", "unit_short": "A number as reported by the source; the unit is given in the metric name or description.", "calc": "Government of Canada expenditures on the Nutrition North Canada program by fiscal year (2021-22 to 2025-26), from the program's 'How Nutrition North Canada works' page; the latest year is a planned figure.", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#7AA3B5\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11.5 21 H36.5 L33.2 36 H14.8 Z\"/><path d=\"M18 21 L22.5 12.5 M30 21 L25.5 12.5\"/><path d=\"M20 25.5 V31.5 M24 25.5 V31.5 M28 25.5 V31.5\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#7AA3B5\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11.5 21 H36.5 L33.2 36 H14.8 Z\"/><path d=\"M18 21 L22.5 12.5 M30 21 L25.5 12.5\"/><path d=\"M20 25.5 V31.5 M24 25.5 V31.5 M28 25.5 V31.5\"/><\/g><\/svg>", "teaser": "Food security reflects whether all individuals have consistent physical, social, and economic access to sufficient, safe, and nutritious food.", "about": ["<p>Food security reflects whether all individuals have consistent physical, social, and economic access to sufficient, safe, and nutritious food. It is a cornerstone of a sustainable food system and depends on more than food supply alone. In the National Index, Food Security refers to the extent to which individuals and households in Canada have consistent and reliable access to sufficient, safe, nutritious, and culturally appropriate food, enabled by a food system that makes food affordable, accessible, and stable over time.<\/p>", "<p>New metrics have been added to provide more accurate and comprehensive information and to better align the Indicator with the Food and Agriculture Organization’s food security framework. Metrics are drawn primarily from Statistics Canada, Food Banks Canada, the OECD, the FAO and World Bank, and Crown-Indigenous Relations and Northern Affairs Canada.<\/p>"], "observations": ["<p>Food insecurity rose sharply between 2021 and 2023, then eased slightly in 2024.<sup>1<\/sup> The share of people living in households experiencing marginal, moderate or severe food insecurity increased from 18.5% in 2021 to 25.7% in 2023, before falling to 24.0% in 2024 (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2a). Even after that decline, the rate remained 5.5 percentage points above its 2021 level. Including marginal food insecurity captures households facing uncertainty about access to food, as well as those experiencing more severe difficulties.<\/p>", "<p>The burden remained uneven in 2024. Food insecurity affected 34.7% of First Nations, Métis and Inuit people (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2e), 30.8% of children under 18 years (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2c), and 30.4% of people in visible minority groups (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2f), compared with 11.9% of seniors over 65 years (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2d). The rates for women and men were more similar, at 24.2% and 23.9%, respectively (<span class=\"ref\" title=\"Dashboard metric SW.2.1\">SW.2.1<\/span>.2b).<\/p>", "<p>Food costs continued to rise over the same period. The Consumer Price Index for food reached 195.3 in 2025, up from 189.3 in 2024 and 171.5 in 2022, with 2002 set at 100 (<span class=\"ref\" title=\"Dashboard metric SW.2.1.1\">SW.2.1.1<\/span>).<sup>2<\/sup> The estimated cost of a healthy diet also increased from $4.80 purchasing power parity dollars per person per day in 2023 to $5.50 in 2025 (<span class=\"ref\" title=\"Dashboard metric SW.2.1.6\">SW.2.1.6<\/span>).<sup>3<\/sup> For households in the lowest-income quintile, results indicate food spending equivalent to 27.7% of income in 2025 (<span class=\"ref\" title=\"Dashboard metric SW.2.1.4\">SW.2.1.4<\/span>), while food accounted for 9.5% of total household expenditures across all households in 2024 (<span class=\"ref\" title=\"Dashboard metric SW.2.1.5\">SW.2.1.5<\/span>).<sup>4<\/sup> These percentages use different denominators and cannot be compared directly.<\/p>", "<p>Demand for food assistance remained high. Canadian food banks recorded 2,165,776 visits in 2025, approximately 5.2% more than in 2024 and 11.9% more than in 2023 (<span class=\"ref\" title=\"Dashboard metric SW.2.1.3\">SW.2.1.3<\/span>).<sup>5<\/sup> Nutrition North Canada expenditures rose from $131.3 million in 2022–23 to $185.8 million in 2024–25, with a provisional estimate of $203.3 million for 2025–26, pending published actual expenditures (<span class=\"ref\" title=\"Dashboard metric SW.2.2.1\">SW.2.2.1<\/span>).<sup>6<\/sup><\/p>"], "limitations": ["<p>Current household measures focus primarily on food insecurity resulting from financial constraints. They do not fully address other aspects of food security, including availability, physical access, utilization, stability, quality, and cultural acceptability.<\/p>", "<p>The household series currently used ends in 2024, while the other metrics cover different periods and populations. Food-bank visits represent instances of service use rather than unique individuals, and program expenditures do not demonstrate whether affordability or access has improved.<\/p>", "<p>Challenges were also encountered in identifying credible, regularly updated, and nationally comparable data for all dimensions of the FAO framework. Canada’s National Food Security Strategy includes targets related mainly to domestic production, processing capacity, and import dependence, but provides limited measures for tracking household food insecurity and unequal access to nutritious food<sup>7<\/sup>.<\/p>"], "opportunities": ["<p>Future reporting should incorporate the latest household results and track marginal, moderate, and severe food insecurity separately. More detailed reporting by province, territory, Indigenous identity, age, and income would provide a clearer picture of unequal outcomes.<\/p>", "<p>The National Food Security Strategy creates an opportunity to connect the Indicator with national priorities for affordability, domestic production, supply-chain resilience, and northern access. Future reporting could assess whether its initiatives lead to measurable improvements in household food insecurity, healthy-food affordability, and access among vulnerable populations. Integrating food security with income, housing, transportation, and geographic isolation would further strengthen the Indicator and its alignment with the FAO framework.<\/p>"], "notes": ["<a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1310083501\" rel=\"noopener\" target=\"_blank\">Food insecurity by selected demographic characteristics Statistics Canada Table: 13-10-0835-01<\/a>, 2025; <a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1310083501\" rel=\"noopener\" target=\"_blank\">Food insecurity by selected demographic characteristics, Food insecure included Marginal, moderate ans severe<\/a>, 2025.", "<a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810000501\" rel=\"noopener\" target=\"_blank\">Consumer Price Index, annual average, not seasonally adjusted<\/a>, 2025.", "Food and Agriculture Organization of the United Nations (FAO); World Bank (WB), <a href=\"https://data360.worldbank.org/en/indicator/FAO_CAHD_7004\" rel=\"noopener\" target=\"_blank\">Cost of a healthy diet (domestic currency per person per day)<\/a>, 2026.", "<a href=\"https://data360.worldbank.org/en/indicator/FAO_CAHD_7004?view=map\" rel=\"noopener\" target=\"_blank\">data360.worldbank.org<\/a>. Statistics Canada, <a href=\"https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610022501\" rel=\"noopener\" target=\"_blank\">Detailed household final consumption expenditure, provincial and territorial, annual (Table 36-10-0225-01)<\/a>, 2026.", "Food Banks Canada, <a href=\"https://foodbankscanada.ca/hunger-in-canada/hungercount/\" rel=\"noopener\" target=\"_blank\">HungerCount 2026: Impossible trade-offs<\/a>, 2026.", "<a href=\"https://www.nutritionnorthcanada.gc.ca/eng/1415538638170/1415538670874\" rel=\"noopener\" target=\"_blank\">How Nutrition North Canada works<\/a>, 2026.", "Launched by the Government of Canada in 2026, the National Food Security Strategy aims to make food more affordable and accessible while strengthening domestic food production, processing capacity, supply chains, and resilience to international disruptions. Its initiatives seek to increase competition, expand food-processing infrastructure, support year-round production, reduce dependence on imports, and improve access to fresh food in rural, remote, and northern communities. Agriculture and Agri-Food Canada, <a href=\"https://agriculture.canada.ca/en/department/initiatives/national-food-security-strategy\" rel=\"noopener\" target=\"_blank\"><u>National Food Security Strategy<\/u><\/a>, 2026."]}, "SW.3": {"code": "SW.3", "dash": "20", "title": "Animal Care", "block": "swb", "page": "ind_20", "metrics": 7, "groups": [{"code": "Sw3.1", "name": "Farm animal care and welfare standards", "planned": false, "metrics": [{"page": "ind_20", "code": "SW.3.1.2", "name": "Presence of NFACC framework and update history of animal Codes of Practice", "src": [["NFACC Codes of Practice: Beef cattle", "National Farm Animal Care Council", "https://www.nfacc.ca/beef-cattle", "https://www.nfacc.ca/codes-of-practice", "", "2013–2023 (3 years)", ""], ["NFACC Codes of Practice: Bison", "National Farm Animal Care Council", "https://www.nfacc.ca/bison", "https://www.nfacc.ca/codes-of-practice", "", "2017, 2023", ""], ["NFACC Codes of Practice: Chickens, turkeys and breeders", "National Farm Animal Care Council", "https://www.nfacc.ca/chickens-turkeys-and-breeders", "https://www.nfacc.ca/codes-of-practice", "", "2016, 2023", ""], ["NFACC Codes of Practice: Dairy cattle", "National Farm Animal Care Council", "https://www.nfacc.ca/dairy-cattle", "https://www.nfacc.ca/codes-of-practice", "", "2023", ""], ["NFACC Codes of Practice: Equine", "National Farm Animal Care Council", "https://www.nfacc.ca/equine", "https:// urvey cited in the Canadian Roundtable for Sustainable Beef assessment; the report itself was not located.", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#7AA3B5\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"24\" cy=\"30.5\" rx=\"6.5\" ry=\"5.5\" fill=\"#FFFFFF\"/><circle cx=\"13.8\" cy=\"22.5\" r=\"2.6\" fill=\"#FFFFFF\"/><circle cx=\"19.3\" cy=\"15.3\" r=\"2.6\" fill=\"#FFFFFF\"/><circle cx=\"28.7\" cy=\"15.3\" r=\"2.6\" fill=\"#FFFFFF\"/><circle cx=\"34.2\" cy=\"22.5\" r=\"2.6\" fill=\"#FFFFFF\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#7AA3B5\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"24\" cy=\"30.5\" rx=\"6.5\" ry=\"5.5\" fill=\"#7AA3B5\"/><circle cx=\"13.8\" cy=\"22.5\" r=\"2.6\" fill=\"#7AA3B5\"/><circle cx=\"19.3\" cy=\"15.3\" r=\"2.6\" fill=\"#7AA3B5\"/><circle cx=\"28.7\" cy=\"15.3\" r=\"2.6\" fill=\"#7AA3B5\"/><circle cx=\"34.2\" cy=\"22.5\" r=\"2.6\" fill=\"#7AA3B5\"/><\/g><\/svg>", "teaser": "Animal care standards are central to ethical and sustainable food systems.", "about": ["<p>Animal care standards are central to ethical and sustainable food systems. In Canada, these standards are established through species-specific Codes of Practice developed by the National Farm Animal Care Council (NFACC) in collaboration with industry, government, animal-welfare organizations, researchers, and veterinary experts. This Indicator is divided into two components: Farm Animal Care and Welfare Standards, which examines the national framework, Codes of Practice, audit systems, and livestock traceability; and On-Farm Animal Care and Welfare Practices, which assesses selected animal care practices for dairy cattle, laying hens, and beef cattle.<\/p>", "<p>New metrics have been added to provide more accurate and comprehensive information on how national standards are assessed and applied. This responds to limitations identified in the 2025 Index, which focused primarily on whether Codes of Practice existed.<\/p>"], "observations": ["<p>Canada has maintained a national farm animal care framework since 2005. Codes of Practice are periodically reviewed and updated to reflect evolving science, production practices, and public expectations. Recent activity includes updates for dairy cattle in 2023, pigs in 2024, and pullets and laying hens in 2025. Codes for beef cattle, pigs, sheep, poultry, and equine are currently under revision (<span class=\"ref\" title=\"Dashboard metric SW.3.1.2\">SW.3.1.2<\/span>).<sup>1<\/sup><\/p>", "<p>Eight of the 14 animal industries covered by the national framework have an NFACC-recognized animal-care assessment or audit program (<span class=\"ref\" title=\"Dashboard metric SW.3.1.3\">SW.3.1.3<\/span>).<sup>2<\/sup> This new metric addresses a gap identified in 2025 by showing whether industries have established systems for assessing the implementation of their Codes. However, it does not yet show the proportion of farms participating or the results of assessments.<\/p>", "<p>The new on-farm metrics provide an initial picture of selected animal-care practices. A 2023 dairy study found that 75% of surveyed farms provided outdoor access to at least one class of cattle. Access varied from 29% for lactating cows and 27% for young heifers to 48% for dry cows and pregnant heifers (<span class=\"ref\" title=\"Dashboard metric SW.3.2.1\">SW.3.2.1<\/span>).<sup>3<\/sup><\/p>", "<p>Laying-hen housing systems also varied.<sup>4<\/sup> In 2024, 43% of hens were housed in conventional systems and 37% in enriched systems. Free-run systems accounted for 13.5%, organic systems for 4.9%, and free-range systems for 1.4% (<span class=\"ref\" title=\"Dashboard metric SW.3.2.2\">SW.3.2.2<\/span>).<\/p>", "<p>Among surveyed beef producers, 97% reported training handlers in low-stress animal-handling practices (<span class=\"ref\" title=\"Dashboard metric SW.3.2\">SW.3.2<\/span>.3a), 88% had taken measures to support cattle during extreme weather events (<span class=\"ref\" title=\"Dashboard metric SW.3.2\">SW.3.2<\/span>.3b), and 81% had a veterinarian-client-patient relationship (<span class=\"ref\" title=\"Dashboard metric SW.3.2\">SW.3.2<\/span>.3c). These results suggest high reported adoption of selected practices supporting cattle health and welfare.<\/p>"], "limitations": ["<p>Public reporting remains limited on the adoption, implementation, and effectiveness of Codes of Practice. The existence of an audit system does not show how many farms are assessed, the level of compliance achieved, or whether corrective actions are completed.<\/p>", "<p>On-farm metrics cover only selected species and practices. Outdoor access, housing systems and reported management practices provide information on production conditions. Additional animal-based measures are needed to assess welfare outcomes.<\/p>", "<p>Credible, nationally comparable data remain limited for mortality, injury, lameness, disease, pain management, transport losses, and emergency preparedness. Differences in species, production systems, and provincial requirements also make consistent national comparisons difficult.<\/p>"], "opportunities": ["<p>Future reporting could track participation in recognized assessment programs, audit results, non-compliance findings, and corrective actions. Publicly available uptake statistics would improve transparency and show how consistently standards are applied.<\/p>", "<p>Integrating animal-based outcomes—including mortality, injury, lameness, disease incidence, body condition, and transport losses—would help determine whether standards and practices lead to better welfare. Potential sources to explore include on-farm assessment programs, voluntary industry reporting and regulatory inspection records. Further work is needed to determine whether these sources can provide publicly accessible and comparable animal-welfare outcome data. Recurring data by species, region, and production system would improve comparability. Aligning the Indicator with World Organization for Animal Health standards and international benchmarking tools would further strengthen accountability and demonstrate leadership in animal care.<\/p>"], "notes": ["National Farm Animal Care Council, <a href=\"https://www.nfacc.ca/codes-of-practice\" rel=\"noopener\" target=\"_blank\">Codes of Practice<\/a>", "<a href=\"https://www.nfacc.ca/animal-care-assessment\" rel=\"noopener\" target=\"_blank\">National Farm Animal Care Council<\/a>, 2026.", "Journal of Dairy Science, <a href=\"https://www.journalofdairyscience.org/article/S0022-0302(23)00502-7/fulltext\" rel=\"noopener\" target=\"_blank\">Outdoor access practices on Canadian dairy farms<\/a>", "Egg Farmers of Canada, <a href=\"https://www.eggfarmers.ca/resource/annual-reports/\" rel=\"noopener\" target=\"_blank\">Egg Farmers of Canada Annual Report 2025<\/a>, 2026."]}}, "order": ["EN.1", "EN.2", "EN.3", "EN.4", "EN.5", "EN.6", "EN.7", "EC.1", "EC.2", "EC.3", "EC.4", "EC.5", "FI.1", "FI.2", "FI.3", "FI.4", "FI.5", "SW.1", "SW.2", "SW.3"], "funders": {"index": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAADACAYAAACUCtJmAACwrElEQVR42ux9d5hkRdX+e6ru7Z7ZZYElLDmIJJcgigoYmDUnjB+9xGUJuogEFf2ZPrW39TNHgiArOSywjRkz6g6K+imo+MkgAhIlLGHZONN9b9X5/VFVTHHpvn27p3viree5z8JMz+26datOvfWec94DzJBWKpUkAJz0gZO2OPHME6tHnbHoTf7P85a3vOUtb3nLW95mShMz4SEHBgaCarWqjjn1+Bcq5h8Hs/sOF1K8BgDmz59PACifCnnLW97ylre85W2mtGkNfJiZqtWqWLhwoTrm9BMOR4BvkaAtY8RaaAzh0fjQ5cuXrwYzgYjz6ZC3vOUtb3nLW96QM4BTt5XLZbF06VJauHChOvoDJ3wQBX0NU7RlvT4SxToGSXqe2DI8CABKCxeKfCrkLW95y1ve8pa3mdICTNN4v0qlogDI4z/w7rN1iNNr0QZNWuuAgjDSKqY+GRDTGwD8LJ8Gectb3vKWt7zlDbkLeGqDv2q1qt58yilzN5298cJAynfWRkZiAiQIpIkAZg function setTheme(b) {
  const r = document.documentElement.style;
  r.setProperty('--c', b ? b.color : '#1F5A96');
  r.setProperty('--dark', b ? b.dark : '#153F6A');
  r.setProperty('--tint', b ? b.tint : '#E6EEF7');
  r.setProperty('--on', b && b.on ? b.on : '#FFFFFF');
}

function renderNav(active) {
  const items = [['#/', 'Overview', null, active === 'home']].concat(
    DATA.blocks.map(b => ['#/block/' + b.key, b.name, b.color, active === b.key]));
  $('#nav').innerHTML = items.map(([h, t, c, on]) =>
    `<a href="${h}" class="${on ? 'on' : ''}" style="${c ? '--c:' + c : ''}"${on ? ' aria-current="page"' : ''}>${esc(t)}</a>`).join('');
}

const dpart = (t, x) => x ? `<div><h3>${t}</h3><p>${esc(x)}</p></div>` : '';
function methHtml(a, smooth) {
  a = a || {};
  return dpart('How the value is calculated', a.calc) + dpart('Industries (NAICS)', a.naics) + dpart('Status', a.note) +
    (smooth ? `<div><h3>Moving averages</h3><p class="ma">${esc(SMOOTH_NOTE)}</p></div>` : '');
}
function unitHtml(a) { return a ? dpart('Unit', a.unit) : ''; }
let dashTab = 'meth';
function showDashTab(want) {
  const panes = {meth: $('#dashMeth'), src: $('#dashSrc'), unit: $('#dashUnit')};
  const avail = Object.keys(panes).filter(k => panes[k].innerHTML);
  if (want) dashTab = want;
  if (!avail.includes(dashTab)) dashTab = avail[0];
  Object.entries(panes).forEach(([k, el]) => el.hidden = k !== dashTab);
  document.querySelectorAll('#dashTabs .dtab').forEach(b => {
    b.hidden = !avail.includes(b.dataset.p);
    const on = b.dataset.p === dashTab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
  });

}
document.querySelectorAll('#dashTabs .dtab').forEach(b => b.onclick = () => showDashTab(b.dataset.p));
function srcHtml(list) {
  if (!list || !list.length) return '';
  const one = s => {
    const link = s[3] || s[2], name = esc(s[0] || s[1]);
    const head = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${name}</a>` : name;
    const file = s[2] && s[2] !== link ? ` · <a href="${esc(s[2])}" target="_blank" rel="noopener">data file</a>` : '';
    const meta = [s[6] ? '<b>' + esc(s[6]) + '</b>' : '', s[1] && s[1] !== s[0] ? esc(s[1]) : '', s[4] ? esc(/^[\d\s,–-]+$/.test(s[4]) ? 'p. ' + s[4] : s[4]) : '', s[5] ? esc(s[5]) : ''].filter(Boolean).join(' · ');
    return `<li>${head}${file}${meta ? `<br><span class="m">${meta}</span>` : ''}</li>`;
  };
  const first = list.slice(0, 4).map(one).join(''), rest = list.slice(4).map(one).join('');
  return `<h3>${list.length > 1 ? 'Data sources' : 'Data source'}</h3><ul>${first}</ul>` +

}

        <p>Launched as a pilot (Index 1.0) in 2023, the Index offers an inventory of data for a comprehensive set of indicators and metrics, organized into four sustainability blocks: Environment, Food Integrity, Economics and Societal Well-Being. It is made possible by a Coalition of Partners from industry, government, civil society and academia.</p>

// Framework table of the block (as in the Index framework figure): indicators and sub-indicators, each linking to its page.
function fwTable(b) {
  const dot = c => c.replace(/^(\w{2})(\d)/, (m, p, n) => p.toUpperCase() + '.' + n);   // En1.1 -> EN.1.1
  const rows = b.indicators.map(c => I[c]).map(i => `<div class="fw-r">
      <div class="fw-ind"><a href="#/indicator/${i.code}"><span class="code">${i.code}</span>${esc(i.title)}</a></div>
      <div class="fw-sub">${i.groups.map(g => `<a href="#/indicator/${i.code}${g.metrics[0] ? '/' + g.metrics[0].page : ''}"${g.planned ? ' class="pl" title="Planned: no data yet"' : ''}><span class="code">${dot(g.code)}</span><span>${esc(g.name)}${g.planned ? '<em>planned</em>' : ''}</span></a>`).join('')}</div>
    </div>`).join('');
  return `<section class="card fw o4" aria-label="Indicators and sub-indicators">
    <h2>Indicators and sub-indicators</h2>

    <div class="fw-h"><span>Indicators</span><span>Sub-indicators</span></div>${rows}</section>`;
}

function paras(list) { return list.join(''); }

      <div class="band-main"><div class="band-main-l">

        <div class="sibs-wrap"><div class="sibs-h">Indicators</div>
          <nav class="sibs" style="--cols:${b.indicators.length > 3 ? 2 : 1}" aria-label="Other indicators in this block">${sibs}</nav></div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections of the narrative">

// Photo layouts for the lower sections (comparison build): ?look=divider | background | strips | off
function applyLook(PHS) {
  document.body.classList.remove('ph-bg');
  document.querySelectorAll('.ph-bg-credit,#phSwitch').forEach(e => e.remove());
  if (!PHS || !PHS.length) return;
  const lookParam = new URLSearchParams(location.search).get('look'), look = lookParam || 'strips';
  const fig = (p, cap) => `<figure class="ph-fig" style="background-image:url(${p.src})"><span class="ph-cap">${cap}</span><a href="${p.link}" target="_blank" rel="noopener">${esc(p.credit)}</a></figure>`;
  if (look === 'divider') {
    $('#s-about').insertAdjacentHTML('afterend', fig(PHS[1], 'What the latest data show'));
    const pair = document.querySelector('.pair');
    if (pair) pair.insertAdjacentHTML('beforebegin', fig(PHS[2], 'Where the indicator can grow'));
  } else if (look === 'background') {
    document.body.classList.add('ph-bg');
    document.body.style.setProperty('--bgphoto', `url(${PHS[1].src})`);
    document.body.insertAdjacentHTML('beforeend', `<a class="ph-bg-credit" href="${PHS[1].link}" target="_blank" rel="noopener">${esc(PHS[1].credit)}</a>`);
  } else if (look === 'strips') {
    document.querySelectorAll('#left .sec').forEach((s, k) => {
      const p = PHS[(k + 1) % PHS.length];
      s.insertAdjacentHTML('afterbegin', `<div class="ph-strip" style="background-image:url(${p.src})"><a href="${p.link}" target="_blank" rel="noopener">${esc(p.credit)}</a></div>`);
    });
  }
  if (!lookParam) return;      // the layout switcher only shows when comparing (?look=...)
  const q = l => location.pathname + (l === 'off' ? '?look=off' : '?look=' + l) + location.hash;
  document.body.insertAdjacentHTML('beforeend', `<div id="phSwitch"><span>Photo layout</span>${[['divider', 'Dividers'], ['background', 'Background'], ['strips', 'Strips'], ['off', 'Header only']].map(([l, t]) => `<a href="${q(l)}" class="${l === look ? 'on' : ''}">${t}</a>`).join('')}</div>`);
}

function renderMetrics(i, want) {
  const num = c => c.split('.').pop();   // 14.1.8 -> 8 (8.4.1d -> 1d)
  const G = i.groups;
  $('#mpanel').innerHTML = `<div class="mp-row">
    <div class="mp-f"><label for="mpSub">Sub-indicator${TIPI('Pick a sub-indicator and a metric in the menus to change the chart.')}</label><select id="mpSub">${G.map((g, k) =>
      `<option value="${k}">${esc(num(g.code) + '. ' + g.name)}</option>`).join('')}</select></div>
    <div class="mp-f"><label for="mpMet">Metric${TIPI('Pick a sub-indicator and a metric in the menus to change the chart.')}</label><select id="mpMet"></select></div>
    <button type="button" class="mp-dl" id="mpDl" title="Download the data shown in the chart (CSV)" aria-label="Download the data shown in the chart as a CSV file"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.99 5.99 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg></button></div><div class="mhead" id="mhead"></div>`;
  const sub = $('#mpSub'), met = $('#mpMet');
  const flash = () => [sub, met].forEach(e => { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
  let cur = G[0].metrics[0], startMet = 0;
  const head = m => { $('#mhead').innerHTML = `<span class="mh-ic">${i.iconInv}</span><div><div class="mh-k">${esc(i.code + ' · ' + i.title)}</div><div class="mh-t">${esc(m.code + '  ' + m.name)}</div></div>`; };
  const show = m => { cur = m; head(m); setDashboard(m.page, `${i.code} ${i.title} · ${m.code}`, MTIP(i), m.src, m.smooth, m.about); history.replaceState(null, '', '#/indicator/' + i.code + '/' + m.page); flash(); };
  const fill = () => {
    met.innerHTML = G[sub.value].metrics.map((m, k) => `<option value="${k}">${esc(num(m.code) + '. ' + m.name)}</option>`).join('');
  };
  if (want) G.forEach((g, k) => g.metrics.forEach((m, n) => { if (m.page === want) { cur = m; sub.value = k; startMet = n; } }));
  fill();
  if (startMet) met.value = startMet;
  head(cur);
  flash();
  sub.onchange = () => { fill(); show(G[sub.value].metrics[0]); };
  met.onchange = () => show(G[sub.value].metrics[met.value]);
  const loadRows = () => window.METRIC_ROWS ? Promise.resolve() : new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'metric_data.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc);
  });
  $('#mpDl').onclick = () => loadRows().then(() => {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const g = G[sub.value], rows = window.METRIC_ROWS[cur.page] || [];
    const lines = [['Indicator', 'Sub-indicator', 'Metric code', 'Metric', 'Series', 'Period', 'Value', 'Unit', 'Source'].map(q).join(',')]
      .concat(rows.map(r => [i.code + ' ' + i.title, g.code + ' ' + g.name, cur.code, cur.name, r[0], r[1], r[2], r[3], r[4]].map(q).join(',')));
    const url = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'index2_' + cur.code + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }).catch(() => alert('The data file (metric_data.js) must be in the same folder as this page.'));
  return cur;
}
const TIPI = t => `<span class="tipi" tabindex="0" role="img" aria-label="${esc(t)}" data-tip="${esc(t)}">${INFO}</span>`;
const MTIP = i => 'Pick a sub-indicator and metric in the menus above to change the chart, and use the series list in the dashboard to show or hide lines. Codes such as <span class="ref">' + i.code + '.1.1</span> in the text point to metrics in the dashboard.';

// The right column is frozen; when it is taller than the window it first scrolls with the page until its bottom
// (the sources and notes under the chart) is in view, then stays put while the left column keeps scrolling.
function fitRight() {
  const r = $('#right'); if (!r) return;
  r.style.setProperty('--rtop', Math.min(78, Math.round(window.innerHeight - r.offsetHeight - 16)) + 'px');
}
window.addEventListener('resize', fitRight);
if (window.ResizeObserver) new ResizeObserver(fitRight).observe($('#right'));

function route() {
  $('#layout').classList.remove('ind');
  document.body.classList.toggle('ind-page', location.hash.replace(/^#\/?/, '').split('/')[0] === 'indicator');
  $('#wide').style.display = 'none'; $('#wide').innerHTML = '';
  $('#left').style.display = ''; $('#right').style.display = '';
  $('#mpanel').innerHTML = '';
  const h = location.hash.replace(/^#\/?/, '');
  const [kind, arg, met] = h.split('/');
  if (kind === 'block') viewBlock(arg);
  else if (kind === 'indicator') viewIndicator(decodeURIComponent(arg || ''), decodeURIComponent(met || ''));
  else viewHome();
  document.title = (kind === 'indicator' && I[arg] ? I[arg].code + ' ' + I[arg].title + ' · ' :
                    kind === 'block' && B[arg] ? B[arg].name + ' · ' : '') + 'National Index on Agri-Food Performance';
}
window.addEventListener('hashchange', () => { route(); window.scrollTo({top: 0, behavior: 'instant'}); });
route();
</script>
