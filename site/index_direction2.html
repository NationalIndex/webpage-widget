9 36.5 33 35 33 33 V27\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#D9A23E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"24\" cy=\"15\" rx=\"9\" ry=\"3.5\"/><path d=\"M15 15 V21 C15 23 19 24.5 24 24.5 C29 24.5 33 23 33 21 V15\"/><path d=\"M15 21 V27 C15 29 19 30.5 24 30.5 C29 30.5 33 29 33 27 V21\"/><path d=\"M15 27 V33 C15 35 19 36.5 24 36.5 C29 36.5 33 35 33 33 V27\"/><\/g><\/svg>", "teaser": "The Financial Vibrancy & Resiliency indicator assesses the financial performance, stability, and long-term viability of Canada’s farming and agri-food sectors.", "about": ["<p>The Financial Vibrancy &amp; Resiliency indicator assesses the financial performance, stability, and long-term viability of Canada’s farming and agri-food sectors. It evaluates the sectors’ ability to generate income, attract investment, manage financial risk, and maintain resilience in the face of economic and market fluctuations. It also measures infrastructure and productive capacity, including both capital and labour gaps, and assesses the sector’s resilience and vulnerability to external shocks.<\/p>", "<p>This indicator reflects how well the agri-food system is positioned to sustain operations, adapt to challenges, and support future growth by remaining competitive and resilient over time. It captures multiple dimensions of financial health, including profitability, debt-asset ratios and return on investment, capital stock, production capacity, labour gaps, and bankruptcy rates. It also includes metrics describing the state of Canada’s infrastructure that is important for sustaining trade and sector performance, through broadband coverage and rail and greenhouse assets. Supply chain resilience captures the vulnerability of the sector to trade and domestic shocks through its measures of import dependency and export concentration.<\/p>"], "observations": ["<p>Financial metrics for the farm and food and beverage manufacturing sectors reveal how the sector was under pressure in 2025 yet still managed to remain profitable. Net farm cash income (NCI) rose by 2.7% in 2025, as revenues rose more than expenses. However, compared to its five-year average, NCI was down 5.8%. Despite lower program payments, market receipts rose 6.1% as revenues were boosted by stronger commodity prices, particularly for livestock. The debt-to-asset ratio on the average farm stabilized around 0.16, yet farm bankruptcy rates for farmers rose in 2025 to .13% from .1% in 2024. The percentage of financially healthy farms declined slightly to 91% in 2024/25 from 92% in 2022/23. Bankruptcy rates in most other agri-food industries fell, in 2025 compared to 2024, reflecting improved financial performance. In particular, those in food, beverage and tobacco manufacturing fell from 1.17% in 2024 to .81% in 2025 after having risen since 2021.<\/p>", "<p>In food manufacturing, profitability was up as revenues rose more than expenses and the industry’s return on equity (ROE) increased to 9.6% in 2024, up from 8.5% in 2023. Beverage manufacturing saw its ROE rise as well to 6.6% from 5.7%. Both industries saw reduced capacity utilization and lower capital investments in 2025, with investment in food manufacturing falling to $ 7.9 billion from $8.2 billion in 2024.<\/p>", "<p>Job vacancy rates were down in food and beverage manufacturing in 2025 to 2.3% and 2.53% respectively. Other agri-food industries also experienced a decline in job vacancies in 2025, including food retail (2.2%) and restaurants (4.45%) as labour market conditions strengthened.<\/p>", "<p>To facilitate production and export marketing capacity in the agri-food sector, adequate infrastructure is important. In 2025, broadband coverage improved, rising to 97.3% nationally and 86.9% in rural Canada.<sup>1<\/sup> It also rose to 71.8% coverage for First Nations. The number of rail cars unloaded at Western ports, from where a significant portion of Canada’s agriculture products are shipped, rose from 34,634 cars in 2023 to 36,528 in 2024 as Canada boosted exports. Greenhouse area expanded to reach 35.9 billion square metres under glass, up 1.4% over the previous year as the greenhouse industry continued to expand.<\/p>", "<p>The sector’s resilience is determined to a great degree by its reliance on the share of production that is exported, and on the degree to which Canada relies on imports for both its intermediate inputs and finished food products. New metrics added to Index 2.0 this year measure these. In 2024, food manufacturing imports increased as a share of domestic food availability to 30.2% from 28.3% in 2023, as pesticides and fertilizers imports also rose as a share. Beverage and tobacco and agricultural implements industries reduced their dependence on imports, on the other hand. In terms of exports as a share of production, food manufacturing and beverage and tobacco manufacturing increased their shares modestly in 2024.<\/p>", "<p>Other metrics were added this year to measure resilience at the farm level. Metrics measuring the average age of farmers and the share of farms that report having succession plans for farm transitioning are being proposed to reflect how resilient and adaptable farmers are and how probable they will remain so in the future. These metrics, which show how producers are aging and the low rate of succession planning, measure the extent to which there is a risk that there will be fewer farmers in the future. The average age of farmers continues to rise, to 56 years old (in 2021) with the share of operators 55 years and over at 60.5%. The share of farms with a written succession plan remains low at only 10.5% of farms, reflecting how the transfer of farm assets to a new generation of farmers may run into difficulties, and impact the future resilience of the sector.<\/p>"], "limitations": ["<p>Being able to measure profitability and resilience at the farm and firm level for this sector is less reliable because of the lower frequency of farm financial survey data being collected (every two years) or due to the lag in balance sheet data from industry financial statements. Hence the picture provided here currently is somewhat dated and less up to date. Also, only industry averages are available, which can mask large differences among individual farm and firm players.<\/p>"], "opportunities": ["<p>Resilience is clearly a characteristic of the sector that is needed in these times of uncertainty and geopolitical turmoil, allowing the industry to bounce back from shocks and adapt. Apart from the metrics that have recently been introduced, there are likely opportunities to find additional measures of resilience in the sector. Administrative data, which are available from farm programs may provide new opportunities to find metrics that tell of the financial viability of the sector, something that Statistics Canada has been increasingly open to do.<\/p>"], "notes": ["Canadian Radio-television and Telecommunications Commission (CRTC), <a href=\"https://crtc.gc.ca/eng/publications/reports/PolicyMonitoring/ban.htm\" rel=\"noopener\" target=\"_blank\">Communications Market Reports - Current trends - High-speed broadband (Internet Availability, 50/10/Unlimited)<\/a>, 2026."]}, "EC.3": {"code": "EC.3", "dash": "16", "title": "Innovation", "block": "eco", "page": "ind_16", "metrics": 11, "groups": [{"code": "Ec3.1", "name": "R & D", "planned": false, "metrics": [{"page": "ind_16", "code": "EC.3.1.1", "name": "Government of Canada expenditures for research and development for agriculture", "src": [["OECD Agricultural Policy Monitoring and Evaluation", "OECD", "https://doi.org/10.1787/agr_pol-2017-en", "https://www.oecd.org/en/topics/policy-issues/agricultural-policy-monitoring-and-evaluation.html", "Canada chapter: 'Estimates of support to agricultu nada Service Standards for Categories A-L Authorizations", "Health Canada (Pest Management Regulatory Agency)", "https://web.archive.org/web/20210730000217/https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations.html", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations.html", "Categories A and B results table", "2019-2020", ""], ["Health Canada Service Standards for Categories A-L Authorizations", "Health Canada (Pest Management Regulatory Agency)", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations/service-standard-categories-authorizations-under-pest-control-products-regulations.html", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations.html", "Categories A and B results table", "2020-2021", ""], ["Health Canada Service Standards for Categories A-L Authorizations", "Health Canada (Pest Management Regulatory Agency)", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations/2021-2022/categories-authorizations-pest-control-products-regulations.html", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations.html", "Categories A and B results table", "2021-2022", ""], ["Health Canada Service Standards for Categories A-L Authorizations", "Health Canada (Pest Management Regulatory Agency)", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations/2022-2023/categories-pest-control-products.html", "https://www.canada.ca/en/health-canada/corporate/about-health-canada/legislation-guidelines/acts-regulations/service-standards-high-volume-regulatory-authorizations.html", "Categories A and B results table", "2022-2023", ""]], "smooth": true, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Value taken directly from the source page, no aggregation applied", "naics": ""}}]}, {"code": "Ec3.3", "name": "Innovation adoption", "planned": false, "metrics": [{"page": "m_16_3_1", "code": "EC.3.3.1", "name": "Farm adoption of innovation", "src": [["Statistics Canada", "Statistics Canada", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210020701", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210020701", "Table 32-10-0207-01", "2017, 2021", ""], ["Use and purpose of Global Positioning System equipment on farms", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100207-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210020701", "Table 32-10-0207-01", "2017, 2021", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}, {"page": "m_16_3_2", "code": "EC.3.3.2", "name": "Indigenous involvement in renewable energy, medium to large projects", "src": [["Regenerative Energy 2026: A National Survey of Indigenous Clean Energy Leadership Across Canada", "Indigenous Clean Energy", "https://indigenouscleanenergy.com/", "https://www.newswire.ca/news-releases/regenerative-energy-2026-new-national-survey-highlights-strength-and-growth-of-indigenous-clean-energy-leadership-across-canada-821418870.html", "Page 8: Total Number of Medium to Large Projects Over Time", "2005–2030", ""]], "smooth": true, "about": {"unit": "Number of projects.", "unit_short": "Number of projects.", "calc": "Value taken directly from the source chart, no aggregation applied", "naics": ""}}, {"page": "m_16_3_3", "code": "EC.3.3.3", "name": "Indigenous involvement in renewable energy, smaller projects", "src": [["Regenerative Energy 2026: A National Survey of Indigenous Clean Energy Leadership Across Canada", "Indigenous Clean Energy", "https://indigenouscleanenergy.com/", "https://www.newswire.ca/news-releases/regenerative-energy-2026-new-national-survey-highlights-strength-and-growth-of-indigenous-clean-energy-leadership-across-canada-821418870.html", "Page 10: Transmission, Storage, Efficiency and Community Projects", "2025", ""]], "smooth": false, "about": {"unit": "Number of projects.", "unit_short": "Number of projects.", "calc": "Value taken directly from the source text, no aggregation applied", "naics": ""}}, {"page": "m_16_3_4", "code": "EC.3.3.4", "name": "Capital funding for Indigenous businesses", "src": [["NACCA Annual Report 2024-25, \"A New Season of Prosperity\"", "National Aboriginal Capital Corporations Association (NACCA)", "https://nacca.ca/wp-content/uploads/2026/07/2024-25-English-Annual-Report.pdf", "https://nacca.ca/", "Page 9: Our Network", "2024-2025", ""]], "smooth": false, "about": {"unit": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "unit_short": "Billions of Canadian dollars (current dollars, not adjusted for inflation).", "calc": "Value taken directly from the source text, no aggregation applied", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#D9A23E\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19.5 30 C16.5 28 14.5 24.8 14.5 21 A9.5 9.5 0 0 1 33.5 21 C33.5 24.8 31.5 28 28.5 30 V33 H19.5 Z\"/><path d=\"M20.5 37 H27.5\"/><path d=\"M24 25 V29\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#D9A23E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19.5 30 C16.5 28 14.5 24.8 14.5 21 A9.5 9.5 0 0 1 33.5 21 C33.5 24.8 31.5 28 28.5 30 V33 H19.5 Z\"/><path d=\"M20.5 37 H27.5\"/><path d=\"M24 25 V29\"/><\/g><\/svg>", "teaser": "The Innovation indicator provides measures of innovation which cover various aspects of the innovation continuum.", "about": ["<p>The Innovation indicator provides measures of innovation which cover various aspects of the innovation continuum. This includes public and private investments in research, extension, commercialization, and adoption of new technologies, and innovative products, processes and marketing and management practices at both the farm and food and beverage manufacturing levels. This indicator also includes measures of regulatory compliance and burden that impact and often impede the extent to which new products and processes can be developed, commercialized and adopted.<\/p>", "<p>The indicator assesses the capacity of Canada’s agri-food sector to develop, adopt, and scale innovations that enhance productivity, sustainability, and competitiveness. It evaluates research and development (R&amp;D) activity, regulatory processes that enable innovation, and the extent to which new technologies and practices are adopted by both producers and food and beverage manufacturers.<\/p>", "<p>The indicator captures how innovation supports improvements in production efficiency, environmental performance, and value creation across the agri-food system. It considers both public and private investment in innovation, as well as the ecosystem that facilitates the development and commercialization of new solutions. This indicator aligns with the Economic block through its focus on long-term growth, competitiveness, and system transformation.<\/p>"], "observations": ["<p>According to the OECD, government expenditures on R&amp;D in agriculture have grown over the past five years after having declined in the previous decade. These expenditures rose 0.6% to $990.9 million in 2024 from $985.4 million in 2023 as spending on knowledge transfer increased while that of knowledge generation (i.e. R&amp;D) remained flat. The government’s focus on climate change meant that much of the R&amp;D spending was focused on GHG emissions reductions rather than productivity enhancing innovations. Private sector investment in in-house R&amp;D by food and beverage manufacturing declined in 2024 after having increased to decade high levels in 2023. Private sector R&amp;D in agriculture was also down in 2024.<\/p>", "<p>Along the innovation continuum, adoption of new technologies, products, processes or business practices are important metrics of innovation. At the farm level, data from the Farm Management Survey showed how 84% of crop farmers adopted GPS technology in 2021, unchanged from this rate in 2016. Other farm practices that were being readily adopted include automation, robotic milking and precision agriculture. For food and beverage manufacturers, Statistics Canada’s most recent survey of innovation in food processing showed that 67.7% of food manufacturing businesses had introduced at least one innovation between 2021 and 2023, but this was down from 72.1% between 2016 and 2018, the last year of the survey. Process innovations declined the most, and larger businesses were more likely to innovate than smaller businesses.<\/p>", "<p>Innovation and growth is known to be impacted by regulatory burden. This is because compliance becomes costly as it delays production and slows approvals of new products. In this way regulations impact the efficiency with which agriculture and food products can be produced and marketed in Canada. An increase in regulatory burden makes Canada’s agriculture and agri-food industry less competitive with impacts on costs and prices for consumers. In 2025, the Canadian Food Inspection Agency (CFIA), which is responsible for regulations covering plant and animal health and disease, food safety, inspection of licensed establishments, labelling and packaging and trade regulations, saw the number of regulatory requirements increase from 4,395 in 2025, up 5% from 4,178 in 2024. However, compared to the 2014 baseline count, the number was down 60%.<\/p>", "<p>Another metric which reflects the impact of regulations on the sector is that related to the speed of approvals of pest control products. In 2022/23, 91% of Category B submissions to the Pest Management Review Agency which approves pest products were completed within the established service standards or negotiated timelines, and this was down slightly from 92% in 2022/22.<\/p>"], "limitations": ["<p>Similar to other indicators, there are limitations in finding regular and easily accessible data to describe innovation in the sector. Many of metrics rely on surveys that are only collected every two years or sporadically. And even if the data is available, it often comes at a cost or is difficult to find.<\/p>"], "opportunities": ["<p>Innovation is a key predictor of future productivity and economic growth and competitiveness and plays a role in enhancing climate resilience, food affordability and security and social sustainability. This is a result of the introduction and adoption of new technologies and new products that meet consumer demand. Being able to find new data and indicators of innovation will help us understand better the prospects for future growth, competitiveness, resilience and sustainability of the agriculture and agrifood sector. Better data on regulatory compliance and burden would provide us with a better sense of where the barriers to economic growth and innovation are as well.<\/p>"], "notes": []}, "EC.4": {"code": "EC.4", "dash": "17", "title": "Sustainable Finance", "block": "eco", "page": "ind_17", "metrics": 2, "groups": [{"code": "Ec4.1", "name": "Market-based sustainable capital / investment", "planned": true, "metrics": [{"page": "ind_17", "code": "EC.4.1.1", "name": "Market-based sustainable capital / investment", "src": [], "smooth": false, "about": {"unit": "", "unit_short": "", "calc": "", "naics": "", "note": "No data yet. This sub-indicator is planned for the Index; no metric is available to report so far."}}]}, {"code": "Ec4.2", "name": "Government Climate Solutions Funding", "planned": false, "metrics": [{"page": "m_17_2_1", "code": "EC.4.2.1", "name": "Government of Canada Funding", "src": [["Agriculture and Agri-Food Canada. (2025). Agricultural Climate Solutions - On-Farm Climate Action Fund.", "Agriculture and Agri-Food Canada", "https://agriculture.canada.ca/en/agricultural-programs-and-services/agricultural-climate-solutions-farm-climate-action-fund-0", "", "Program page and funding announcements", "2020, 2025", ""]], "smooth": false, "about": {"unit": "Millions of Canadian dollars (current dollars, not adjusted for inflation).", "unit_short": "Millions of Canadian dollars (current dollars, not adjusted for inflation).", "calc": "Value taken directly from the source chart, no aggregation applied", "naics": ""}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#D9A23E\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19.5 L24 12 L36 19.5 Z\"/><path d=\"M16 23 V33 M21.3 23 V33 M26.7 23 V33 M32 23 V33\"/><path d=\"M12 36.5 H36\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#D9A23E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19.5 L24 12 L36 19.5 Z\"/><path d=\"M16 23 V33 M21.3 23 V33 M26.7 23 V33 M32 23 V33\"/><path d=\"M12 36.5 H36\"/><\/g><\/svg>", "teaser": "The Sustainable Finance indicator assesses the extent to which financial resources are mobilized to support sustainability objectives within Canada’s agri-food sector.", "about": ["<p>The Sustainable Finance indicator assesses the extent to which financial resources are mobilized to support sustainability objectives within Canada’s agri-food sector. It evaluates both market-based and public funding mechanisms that enable investments in climate-smart practices, environmental improvements, and broader sustainability outcomes across the value chain.<\/p>", "<p>The indicator captures financial flows directed toward sustainability, including private capital, investments aligned with environmental, social, and governance (ESG) criteria, and government or NGO funding programs that promote climate smart agriculture. It reflects how financial systems are evolving to support the transition toward more sustainable agri-food production and supply chains.<\/p>"], "observations": ["<p>In 2025, a change in policies in Ottawa led to more focus on growth and competitiveness by the new Carney government. One of agriculture’s key funding programs, the Living Labs was terminated. However, federal government funding to support the On-Farm Climate Action Fund under the Agriculture Climate Solutions program rose to $108.6 million in 2024/25, from $96.1 million in 2022/23. The program first launched in Budget 2021, was to allocate $704.1 million to this program over a five-year period, and additional funds were added to support Eastern farmers facing high fertilizer costs in 2022. Other sustainability funding programs related to Clean technology continued to be funded in Budget 2025.<\/p>"], "limitations": ["<p>This indicator aligns with the Economic block by focusing on the financial foundations that enable sustainable transformation, but it does not assess the effectiveness of individual investments or quantify sustainability impacts directly but rather emphasizes the availability and direction of capital toward sustainability goals. More metrics could be developed to measure this aspect of financial support. The current metrics which reflect federal government funding of climate smart agriculture programs at AAFC may have to be updated because some of the programming under this category is being discontinued.<\/p>"], "opportunities": ["<p>Sustainable finance has evolved as an area to cover financing initiatives that incent environmental practices to mitigate and adapt to climate change, and also to help companies report on ESG results and support from financial institutions. More recent developments in sustainable finance are identifying ways to mobilize investments to support nature and nature-based solutions and assets. Hence future versions of the Index may develop more metrics along these lines.<\/p>"], "notes": []}, "EC.5": {"code": "EC.5", "dash": "EC.5", "title": "Productivity", "block": "eco", "page": "ind_EC5", "metrics": 4, "groups": [{"code": "Ec5.1", "name": "Major crop productivity", "planned": false, "metrics": [{"page": "ind_EC5", "code": "EC.5.1.1", "name": "Major crop productivity", "src": [["Estimated areas, yield, production, average farm price and total farm value of principal field crops, in metric and imperial units", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/32100359-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3210035901", "Table 32-10-0359-01", "2010–2025", ""]], "smooth": true, "about": {"unit": "Kilograms per hectare of land (1 hectare = 10,000 square metres, about 2.5 acres).", "unit_short": "Kilograms per hectare of land (1 hectare = 10,000 square metres, about 2.5 acres).", "calc": "Value taken directly from the source table, no aggregation applied", "naics": ""}}]}, {"code": "Ec5.2", "name": "Primary agriculture productivity", "planned": false, "metrics": [{"page": "m_EC_5_2_1", "code": "EC.5.2.1", "name": "Primary Agriculture Productivity", "src": [["USDA, Economic Research Service, International Agricultural Productivity", "USDA Economic Research Service", "https://www.ers.usda.gov/data-products/international-agricultural-productivity", "", "Sheet AgTFPInt2023_long", "2015–2023", ""]], "smooth": true, "about": {"unit": "Index number: the value in 2015 is set to 100, so 110 means 10% above 2015.", "unit_short": "Index number: the value in 2015 is set to 100, so 110 means 10% above 2015.", "calc": "Value taken directly from the source's 'AgTFPInt2023_long' sheet, no aggregation applied", "naics": ""}}]}, {"code": "Ec5.3", "name": "Food manufacturing productivity", "planned": false, "metrics": [{"page": "m_EC_5_3_1", "code": "EC.5.3.1", "name": "Food Manufacturing Productivity", "src": [["Multifactor productivity, gross output, value-added, capital, labour and intermediate inputs at a detailed industry level", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100217-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610021701", "Table 36-10-0217-01", "2017–2021", ""]], "smooth": true, "about": {"unit": "Index number: the value in 2017 is set to 100, so 110 means 10% above 2017.", "unit_short": "Index number: the value in 2017 is set to 100, so 110 means 10% above 2017.", "calc": "Value taken directly from the source table, no aggregation applied", "naics": "311 Food manufacturing; 312 Beverage and tobacco product manufacturing | Multifactor productivity and related variables (Table 36-10-0217-01), index 2017 = 100, for NAICS 311 and NAICS 312 reported separately; sub-classes are multifactor productivity, labour input, capital input and intermediate inputs."}}]}, {"code": "Ec5.4", "name": "Labour productivity", "planned": false, "metrics": [{"page": "m_EC_5_4_1", "code": "EC.5.4.1", "name": "Labour Productivity", "src": [["Labour productivity and related measures by business sector industry and by non-commercial activity consistent with the industry accounts, inactive", "Statistics Canada", "https://www150.statcan.gc.ca/n1/tbl/csv/36100480-eng.zip", "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610048001", "Table 36-10-0480-01", "2010–2024", ""]], "smooth": true, "about": {"unit": "Output in dollars adjusted to 2017 prices per hour worked (labour productivity).", "unit_short": "Output in dollars adjusted to 2017 prices per hour worked (labour productivity).", "calc": "Value taken directly from the source table, no aggregation applied", "naics": "BS11A Crop and animal production; BS111 Crop production; BS112 Animal production; BS311 Food manufacturing; BS312 Beverage and tobacco product manufacturing; BS3253 Pesticide, fertilizer and other agricultural chemical manufacturing; BS411 Farm product wholesaler-distributors; BS413 Food, beverage and tobacco wholesaler-distributors; BS445 Food and beverage retailers (previously Food and Beverage Stores); BS722 Food services and drinking places | NAICS 445 was named 'Food and beverage stores' in StatCan sources through 2021; renamed 'Food and beverage retailers' from 2022 onward."}}]}], "icon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#D9A23E\"/><g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13.5 31 A11.5 11.5 0 1 1 34.5 31\"/><path d=\"M24 28 L31 19.5\"/><circle cx=\"24\" cy=\"28\" r=\"2.2\"/><path d=\"M16.5 22.5 L18.5 23.5 M24 16 V18.5 M31.5 22.5\"/><\/g><\/svg>", "iconInv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" width=\"48\" height=\"48\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#FFFFFF\"/><g fill=\"none\" stroke=\"#D9A23E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13.5 31 A11.5 11.5 0 1 1 34.5 31\"/><path d=\"M24 28 L31 19.5\"/><circle cx=\"24\" cy=\"28\" r=\"2.2\"/><path d=\"M16.5 22.5 L18.5 23.5 M24 16 V18.5 M31.5 22.5\"/><\/g><\/svg>", "teaser": "The productivity indicator is a new addition to Index 2.0 this year.", "about": ["<p>The productivity indicator is a new addition to Index 2.0 this year. It is important because of its direct link to economic growth, competitiveness and sustainability. It measures the industry’s ability to produce more and better with less. Productivity is measured by comparing the output that is produced with a given amount of inputs, such as labour, capital, land or raw materials. Productivity growth occurs when more output is produced with the same amount of inputs, or when the same amount of output can be produced with fewer inputs. This ensures the sector remains sustainable and can lead to lower costs and greater profitability as well as increased competitiveness and economic growth.<\/p>", "<p>The most common productivity metric is labour productivity which measures output from a given amount of labour, such as output per employee or per hour worked. Labour productivity is provided for the agriculture, and food and beverage manufacturing industry. Other partial productivity metrics are available but are less often reported, such as capital productivity. However, crop yields measured as kilograms per hectare are another important partial productivity metric included in Index 2.0. But partial productivity metrics only tell part of the story. This is told by Total Factor productivity or Multifactor productivity which are provided for agriculture and for food and beverage manufacturing respectively. These account for how efficiently all inputs are combined to produce the sector’s output. These total (multi) productivity metrics reflect the impact of new technologies, or even new ways of managing or organizing production that lead to greater efficiency and possibly even scale.<\/p>"], "observations": ["<p>One of the new metrics introduced in Version 2.0 of the Index is labour productivity in agriculture and food and beverage manufacturing, which measure output per hours worked. Over the period 2010 to 2024, labour productivity in food manufacturing grew 0.9% per year, from $54.30 per hour to $61.60 per hour. It grew faster (1.1%) in the earlier part of the period (2010 to 2018) than in the latter part (2018 to 2024), when it hardly grew, reflecting a slowdown in productivity in the Canadian economy more broadly. This was true for all industries (0.2%), from agriculture (2.0%) to food manufacturing (0.7%) to beverage and tobacco manufacturing (-4.5%). The significant productivity slowdown after 2018 may be partly explained by COVID in 2020-22 which disrupted labour markets, but it could also reflect a more significant structural change, due to inflation, higher costs and commodity prices or reduced business investments after 2018.<\/p>", "<p>Total factor productivity (TFP) in agriculture is another new metric introduced this year. This metric is produced by the United States Department of Agriculture (USDA) based on a collaboration of international experts who provide individual country data and expertise from Canada and other countries. It is the basis for the University of Virginia Tech's annual Global Agricultural Productivity (GAP) report. TFP data tell us that between 1991 and 2000, productivity growth grew by 2.1% per year, as a major contributor to the growth in agricultural output of 2.3% per year while input use grew only marginally. Over the more recent period, 2020 to 2023, Canada experienced a large decline in agricultural output (-1.7% per year) primarily due to negative productivity growth (-1.1%%) as a result of a major drought on the Prairies in 2021 which reduced agricultural output significantly.<\/p>"], "limitations": ["<p>This indicator aligns with the Economic block by focusing on efficiency, competitiveness, and long-term economic performance of the agri-food system. It is directly related to investments in R&amp;D and the adoption of new technologies and practices. It does not however measure productivity directly on a per farm or firm level, nor does it directly assess environmental or social outcomes, although productivity improvements certainly have implications for both.<\/p>"], "opportunities": ["<p>There is a possibility to improve the productivity indicators by drawing on other sources of data and analysis that can help explain and reinforce the significance of this indicator for telling the story about economic sustainability. Other sources include the OECD, the Bank of Canada and the Canadian Centre for the Study of Living Standards that put significant resources into the development of data and analysis explaining productivity metrics.<\/p>", "<h1 id=\"societal-well-being\">SOCIETAL WELL-BEING<\/h1>"], "notes": []}, "FI.1": {"code": "FI.1", "dash": "8", "title": "Safe Food", "block": "fi", "page": "ind_8", "metrics": 13, "groups": [{"code": "Fi1.1", "name": "Overall Safety of Canada's Food System", "planned": false, "metrics": [{"page": "ind_8", "code": "FI.1.1.1", "name": "Food safety compliance", "src": [["2023 to 2024 Departmental Sustainable Development Strategy Report", "Canadian Food Inspection Agency", "https://inspection.canada.ca/sites/default/files/documents/2024-10/2023-2024-dsds-report-eng.pdf", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/2023-2024-dsdsr", "6", "2022-2023, 2023-2024", ""], ["2024 to 2025 Departmental Sustainable Development Strategy Report", "Canadian Food Inspection Agency", "https://publications.gc.ca/collections/collection_2025/acia-cfia/A101-18-2025-eng.pdf", "https://inspection.canada.ca/en/about-cfia/transparency/corporate-management-reporting/environment-and-sustainable-development/dsds-2024-2025", "6", "2024-2025", ""]], "smooth": false, "about": {"unit": "Per cent: a share or rate out of 100.", "unit_short": "Per cent: a share or rate out of 100.", "calc": "Value read directly from the 'in
